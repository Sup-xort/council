<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 사이트에 어두운 화면이 있다고 브라우저에 알린다. 없으면 삼성 인터넷 등이 제멋대로 색을 뒤집는다 -->
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141211" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>SWITCH 관리</title>
<style>
/* 색은 학생 사이트(index.html)와 같다 */
:root{color-scheme:light dark;
  --bg:#F6F7F3;--card:#FFFFFF;--fill:#EFF1EC;--ink:#3A2C2C;--sub:#6B6060;
  --brand:#5B4545;--on-brand:#FFFFFF;
  --ok:#CCE3B8;--ok-ink:#3A2C2C;--ok-soft:#E6F0DC;
  --mine:#C4E4F4;--mine-ink:#3A2C2C;
  --busy:#E5E1E0;--busy-ink:#5B4545;
  --line:rgba(91,69,69,.12);--tint:rgba(91,69,69,.07);--dot:rgba(91,69,69,.25);
  --req:#B3261E;--safe-b:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141211;--card:#1F1B1A;--fill:#2A2524;--ink:#F2ECEA;--sub:#ABA19F;
  --brand:#EADFDD;--on-brand:#1F1B1A;
  --ok:#3E5A33;--ok-ink:#F2ECEA;--ok-soft:#2A3823;
  --mine:#2B5265;--mine-ink:#F2ECEA;
  --busy:#38322F;--busy-ink:#E0D6D4;
  --line:rgba(255,255,255,.09);--tint:rgba(255,255,255,.08);--dot:rgba(255,255,255,.3);
  --req:#F2B8B5}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#141211;--card:#1F1B1A;--fill:#2A2524;--ink:#F2ECEA;--sub:#ABA19F;
  --brand:#EADFDD;--on-brand:#1F1B1A;
  --ok:#3E5A33;--ok-ink:#F2ECEA;--ok-soft:#2A3823;
  --mine:#2B5265;--mine-ink:#F2ECEA;
  --busy:#38322F;--busy-ink:#E0D6D4;
  --line:rgba(255,255,255,.09);--tint:rgba(255,255,255,.08);--dot:rgba(255,255,255,.3);
  --req:#F2B8B5}
:root[data-theme=light]{color-scheme:light}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;min-height:0!important;border:0;border-radius:50%;background:var(--tint);color:var(--ink);padding:0;cursor:pointer;flex:none}
.themebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.5px}
h2{margin:0 0 12px;font-size:16px;font-weight:700}
.muted{color:var(--sub)}

/* 틀: 넓은 화면은 왼쪽 메뉴, 좁은 화면은 위쪽 머리줄 + 옆으로 미는 탭 */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:20px 14px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto}
.side .brand{display:flex;flex-direction:column;padding:4px 10px 16px}
.side .brand b{font-size:18px;color:var(--brand)}.side .brand span{font-size:12px;color:var(--sub)}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{display:flex;align-items:center;min-height:40px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--sub);white-space:nowrap}
.side nav a:hover{background:var(--tint);color:var(--ink)}
.side nav a.on{background:var(--ok);color:var(--ok-ink);font-weight:600}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.side .foot a,.side .foot .themebtn{min-height:32px;display:flex;align-items:center;text-decoration:none}
.page{min-width:0;padding:28px 32px calc(40px + var(--safe-b))}
@media (max-width:899px){
  .shell{display:block}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:0;padding:env(safe-area-inset-top) 12px 0;border-right:0;border-bottom:1px solid var(--line)}
  .side .brand{flex-direction:row;gap:8px;padding:0;height:48px;align-items:center}
  .side .brand span,.side .foot span{display:none}
  .side .foot{order:2;margin:0 0 0 auto;padding:0;border:0;flex-direction:row;gap:12px}
  .side .foot a{min-height:44px}
  .side nav{order:3;flex:1 0 100%;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 4px}
  .side nav::-webkit-scrollbar{display:none}
  .side nav a{min-height:44px;border-radius:0;padding:0 12px;position:relative}
  .side nav a.on{background:none;color:var(--ink)}
  .side nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2.5px;border-radius:2px;background:var(--brand)}
  .page{padding:20px 16px calc(40px + var(--safe-b))}
}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:20px}
.ph h1{flex:1 1 auto}
.ph p{flex:1 0 100%;margin:2px 0 0;color:var(--sub);font-size:14px}

/* 버튼·입력: 촘촘하게, 그래도 손가락으로 누를 수 있게 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:8px;
  background:var(--brand);color:var(--on-brand);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.line{background:var(--tint);color:var(--ink)}
.btn.red{background:var(--tint);color:var(--req)}
.btn.xs{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.in{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;min-width:0}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
select.in{padding-right:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.inline{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);
  padding:8px 16px;border-radius:99px;font-size:13px;z-index:9;max-width:90vw}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--tint);white-space:nowrap}
.tag.ok{background:var(--ok);color:var(--ok-ink)}.tag.mine{background:var(--mine);color:var(--mine-ink)}.tag.warn{background:var(--tint);color:var(--req);font-weight:600}
.gone{color:var(--sub)}
.dt td input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);vertical-align:middle}.dt td input[type=checkbox][disabled]{opacity:1}
.dt .in.ce{height:30px;min-width:90px;width:100%;font-size:13px;padding:0 8px}.rc dd .in.ce{width:100%}
.pay{height:28px;min-width:64px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--sub);font-size:12px;cursor:pointer}
.pay.on{background:var(--ok);border-color:transparent;color:var(--ok-ink);font-weight:600}

/* 표 도구 */
.dt-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.dt-tools .q{flex:1 1 220px}
.dt-period{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.dt-period .in{width:136px}
.dt-period .lab{font-size:12px;color:var(--sub);margin-right:2px}
.dt-count{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}
.dt tr.gh td{height:40px;max-width:none;background:var(--tint);border-bottom:1px solid var(--line);padding:0 6px;white-space:normal}
.gbtn{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;width:100%;min-height:40px;padding:4px 8px;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:pointer}
.gbtn .muted{font-weight:400;font-size:13px}
.dt-cards h3.gh{margin:14px 0 6px;font-size:inherit;background:var(--tint);border-radius:8px}
.rule{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg,transparent)}
.chip{height:26px;padding:0 10px;border:0;border-radius:99px;background:var(--tint);color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.chip:hover{filter:brightness(.96)}.chip:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.dt-wrap{overflow:auto;max-height:calc(100vh - 190px);background:var(--card);border:1px solid var(--line);border-radius:12px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.dt th{position:sticky;top:0;z-index:2;background:var(--card);text-align:left;font-weight:600;color:var(--sub);white-space:nowrap;padding:0;border-bottom:1px solid var(--line)}
.dt th .sort{display:flex;align-items:center;gap:4px;width:100%;height:40px;padding:0 14px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.dt th .sort:hover{color:var(--ink)}.dt th .sort[aria-sort]{color:var(--ink)}
.dt tr.flt th{top:41px;z-index:1;padding:6px 8px;font-weight:400}
.dt tr.flt .in{height:28px;width:100%;min-width:72px;font-size:12px;padding:0 6px}
.dt td{height:42px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.dt td.num,.dt th.num .sort{text-align:right;justify-content:flex-end}
.dt td.act{overflow:visible}.dt td.act .inline{flex-wrap:nowrap;gap:4px}
.dt tbody tr:hover td{background:var(--tint)}
.dt tbody tr:last-child td{border-bottom:0}
.dt .ck{width:40px;padding:0 0 0 16px}
.dt-empty{padding:32px 16px;text-align:center;color:var(--sub)}
.dt-more{display:flex;justify-content:center;padding:10px}
/* 좁은 화면: 한 행 = 한 카드, 열별 필터는 접어 둔다 */
.dt-cards{display:flex;flex-direction:column;gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.rc .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:6px}
.rc dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0;font-size:13px}
.rc dt{color:var(--sub);white-space:nowrap}.rc dd{margin:0;overflow-wrap:anywhere}
.rc .inline{margin-top:10px}
.dt-flt{flex:1 0 100%}
.dt-flt summary{display:inline-flex;align-items:center;min-height:32px;cursor:pointer;color:var(--sub);font-size:13px}
.dt-flt .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:8px 0}
.dt-flt label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}

/* 물품 화면 위쪽 */
.tops{display:grid;gap:16px;margin-bottom:20px}
@media (min-width:900px){.tops{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* 글쓰기 화면: 넓으면 2단(본문 | 설정), 좁으면 위아래 */
.write{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1100px){.write{grid-template-columns:minmax(0,1fr) 340px}.write>.side-set{position:sticky;top:20px}}
.side-set{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
.fld .in,.fld textarea{width:100%;font-size:14px;color:var(--ink)}
.fld .hint{font-size:12px;color:var(--sub)}
.title-in{width:100%;border:0;background:none;font-size:24px;font-weight:700;letter-spacing:-.5px;padding:4px 0;outline:none;color:var(--ink)}
.title-in::placeholder{color:var(--dot)}
.sub-in{width:100%;border:0;border-bottom:1px solid var(--line);background:none;font-size:15px;padding:6px 0 10px;outline:none;color:var(--ink)}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--tint)}
.seg button{flex:1;height:30px;border:0;border-radius:6px;background:none;color:var(--sub);font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rowbox{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.qcard{border:1px solid var(--line);border-left:4px solid var(--dot);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.qcard:focus-within{border-left-color:var(--brand);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.qtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qtop .qtitle{flex:1 1 220px;height:40px;padding:0 10px;border:0;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;background:var(--fill);color:var(--ink);font-size:15px;min-width:0}
.qtop .qtitle:focus{outline:none;border-bottom:2px solid var(--brand)}
.qtop select{flex:1 1 170px;max-width:220px;height:40px}
.qopts{display:flex;flex-direction:column;gap:2px}
.qopt{display:flex;align-items:center;gap:8px}
.qopt i{width:16px;height:16px;border:2px solid var(--dot);border-radius:50%;flex:none}.qopt i.multi,.qadd i.multi{border-radius:4px}
.qn{width:16px;flex:none;text-align:center;font-size:13px;color:var(--sub)}
.qopt input{flex:1;height:36px;padding:0 4px;border:0;border-bottom:1px solid transparent;background:none;color:var(--ink);font-size:14px;min-width:0}
.qopt input:hover{border-bottom-color:var(--line)}.qopt input:focus{outline:none;border-bottom:2px solid var(--brand)}
.qopt button,.qadd{border:0;background:none;color:var(--sub);cursor:pointer;font-size:14px}
.qopt button{width:32px;height:32px;border-radius:50%;font-size:16px}.qopt button:hover{background:var(--tint)}
.qadd{display:flex;align-items:center;gap:8px;height:36px;padding:0;text-align:left}.qadd i{width:16px;height:16px;border:2px dotted var(--dot);border-radius:50%;flex:none}.qadd:hover{color:var(--ink)}
.qprev{color:var(--sub);font-size:13px;border-bottom:1px dotted var(--dot);padding:6px 4px}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.qbar .ib{height:34px;min-width:34px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--sub);font-size:13px;cursor:pointer}
.qbar .ib:hover:not(:disabled){background:var(--tint);color:var(--ink)}.qbar .ib:disabled{opacity:.35;cursor:default}.qbar .ib.del:hover:not(:disabled){color:var(--req)}
.qbar .sp{flex:1}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:0 6px}
.sw input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--dot);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw input:checked{background:var(--brand)}.sw input:checked::after{transform:translateX(16px);background:var(--on-brand)}
.sw input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* 보이는 대로 쓰는 편집기 — 저장은 서식 기호(마크다운)로 하지만 쓰는 사람에겐 보이지 않는다 */
.re{background:var(--card);border:1px solid var(--line);border-radius:12px}
.re-bar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--card);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
@media (max-width:899px){.re-bar{top:93px}}
.re-bar button{height:32px;min-width:36px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.re-bar button{display:inline-flex;align-items:center;gap:5px}
.re-bar button svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.re-bar button:hover{background:var(--tint)}}
.re-bar button:focus{outline:none}.re-bar button:focus-visible{outline:2px solid var(--brand)}
.re-bar button[aria-pressed=true]{background:var(--ok);color:var(--ok-ink);font-weight:600}
.re-bar .sep{width:1px;margin:6px 4px;background:var(--line)}
.re-body{min-height:50vh;padding:20px 24px;outline:none;font-size:16px;line-height:1.75}
.re-body:empty::before{content:attr(data-ph);color:var(--dot)}
.re-body img{cursor:default}
.re-body img.picked{outline:3px solid var(--brand)}
.re-foot{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.re-draft{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--mine);color:var(--mine-ink);border-radius:12px 12px 0 0;font-size:13px}
.re-draft span{flex:1 1 240px}
@media (max-width:600px){.re-body{padding:14px 12px}}

/* 본문 서식 (학생 사이트와 같은 모양) */
.md{word-break:keep-all;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 1.4em}
.md h3{font-size:1.2em;font-weight:700;letter-spacing:-.3px;line-height:1.4;margin:1.8em 0 .6em}
.md h4{font-size:1.05em;font-weight:700;line-height:1.45;margin:1.6em 0 .5em}.md h5{font-size:1em;font-weight:600;margin:1.4em 0 .4em}
.md ul,.md ol{margin:0 0 1.4em;padding-left:1.3em}.md li{margin:.35em 0}
.md blockquote{margin:0 0 1.4em;padding:12px 16px;border-left:3px solid var(--ok);background:var(--fill);border-radius:0 12px 12px 0}.md blockquote p:last-child{margin:0}
.md code{font:.88em ui-monospace,Menlo,monospace;background:var(--fill);padding:1px 4px;border-radius:5px}
.md pre{margin:0 0 1.4em;padding:12px 16px;background:var(--fill);border-radius:14px;overflow-x:auto}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md a{text-decoration:underline;text-underline-offset:3px}
.md img{display:block;max-width:100%;height:auto;border-radius:12px;margin:0 auto 1.4em}
.gate{max-width:420px;margin:15vh auto;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <aside class="side"><div class="brand"><b>SWITCH 관리</b><span>반도체융합공학과 학생회</span></div>
    <nav id="nav" aria-label="관리 메뉴"></nav>
    <div class="foot" id="foot"></div></aside>
  <main class="page" id="app"><p class="muted">불러오는 중…</p></main>
</div>
<script src="common.js"></script>
<script>
let me = null;
const isSuper = () => me?.role === 'super';
const KIND = {dept: '학과 공지', event: '행사 공지'};
const ROLE = {user: '학생', admin: '관리자', super: '최고 관리자'};
const TABS = {home: '로비', notices: '공지', events: '행사', reserve: '세미나실 예약', loans: '물품 대여'};
const toLogin = () => { location.href = './#/login?next=' + encodeURIComponent('admin' + location.hash); };
api.onAuth = toLogin;
const narrow = matchMedia('(max-width:759px)');      // 이보다 좁으면 표 대신 카드

// ── 표 도구: 검색 · 열별 필터 · 기간 · 정렬 · 더 보기 ─────────────────

// 그림: 긴 변 1600px 로 줄여 다시 굽는다 (사진 위치 정보도 같이 지워진다). GIF 는 움직임을 지키려고 그대로.
async function shrinkImage(file) {
  if (file.type === 'image/gif') return file;
  const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const png = file.type === 'image/png';
  return new Promise(res => cv.toBlob(res, png ? 'image/png' : 'image/jpeg', .85));
}
async function uploadImage(file) {
  if (!/^image\//.test(file.type)) throw new Error(toast('그림 파일만 넣을 수 있습니다'));
  toast('그림을 올리는 중…');
  const blob = await shrinkImage(file);
  if (blob.size > 5 * 1024 * 1024) throw new Error(toast('그림은 5MB까지 올릴 수 있습니다'));
  const r = await fetch('api/admin/upload', {method: 'POST', headers: {'Content-Type': blob.type || 'application/octet-stream'}, body: blob});
  const d = await r.json().catch(() => ({error: '연결이 원활하지 않습니다. 잠시 뒤 다시 시도해 주십시오'}));
  if (!r.ok) throw new Error(toast(d.error || '그림을 올리지 못했습니다'));
  return d.url;
}

on(/^\/apps$/, async (m, q, path) => {
  const eid = q.get('event') || '';
  const d = await api('admin/applications' + (eid ? '?id=' + eid : ''));
  const ev = d.event, byId = Object.fromEntries(d.events.map(e => [e.id, e]));
  const all = eid ? (await api('admin/events')).events : d.events;
  const answer = (f, v) => f.type === 'checkbox' ? (v ? '체크함' : '체크 안 함') : f.type === 'multi' ? (v || []).join(', ') : v ?? '';
  const allQuestions = [...new Set(d.events.flatMap(e => e.fields.map(f => f.label)))];
  const cols = [
    ...(ev ? [] : [{k: 'event', label: '행사', filter: 'choice', title: true, val: r => byId[r.event_id]?.title || ''}]),
    {k: 'name', label: '이름', title: !!ev}, {k: 'student_id', label: '학번'}, {k: 'email', label: '이메일'},
    {k: 'dues', label: '학생회비 납부', filter: 'choice', edit: 'check', val: r => r.dues ? '납부' : '미납부',
      html: r => `<input type="checkbox" disabled ${r.dues ? 'checked' : ''} aria-label="${r.dues ? '납부' : '미납부'}">`},
    ...(ev ? ev.fields.map((f, i) => ({k: 'f' + i, label: f.label, filter: f.type === 'text' || f.type === 'long' ? 'text' : 'choice', val: r => answer(f, r.answers[i]),
        edit: f.type === 'checkbox' ? 'check' : f.type === 'select' || f.type === 'dropdown' ? 'select' : f.type === 'multi' ? 'multi' : 'text', options: f.options, raw: r => r.answers[i] ?? (f.type === 'checkbox' ? false : f.type === 'multi' ? [] : '')}))
      : allQuestions.map((label, n) => {      // 모든 행사: 질문 이름마다 한 열. 그 질문이 없는 행사의 신청은 빈칸
          const at = r => (byId[r.event_id]?.fields || []).findIndex(f => f.label === label);
          const types = d.events.flatMap(e => e.fields.filter(f => f.label === label).map(f => f.type));
          return {k: 'q' + n, label, filter: types.every(t => t === 'text' || t === 'long') ? 'text' : 'choice',
            val: r => { const i = at(r), f = byId[r.event_id]?.fields[i]; return f ? answer(f, r.answers[i]) : ''; }};
        })),
    {k: 'created_at', label: '신청일자', type: 'date', period: true, edit: 'datetime', val: r => r.created_at || r.updated_at},
    {k: 'updated_at', label: '수정일자', type: 'date', edit: 'datetime', val: r => r.created_at && r.updated_at !== r.created_at ? r.updated_at : ''},
  ];
  $('#app').innerHTML = head('신청자', ev ? `${esc(ev.title)} 신청 ${d.applications.length}명` : `모든 행사의 신청 ${d.applications.length}건`,
    `<select class="in" id="pick" aria-label="행사 고르기" style="max-width:320px"><option value="">모든 행사</option>${all.map(e => `<option value="${e.id}" ${String(e.id) === eid ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select>`) + '<div id="t"></div>';
  $('#pick').onchange = e => { location.hash = '#/apps' + (e.target.value ? '?event=' + e.target.value : ''); };
  table = dataTable($('#t'), {path: eid ? `/apps?event=${eid}` : path, rows: d.applications, columns: cols, onSave: saver('apps'), empty: '아직 신청한 사람이 없습니다.'});
});

on(/^\/admins$/, async () => {
  const all = (await api('admin/users')).users;
  const sup = all.find(u => u.role === 'super'), admins = all.filter(u => u.role === 'admin'), students = all.filter(u => u.role === 'user');
  const who = u => `<span style="flex:1 1 160px;min-width:0"><b>${esc(u.name)}</b> <span class="muted">${esc(u.student_id)} · ${esc(u.username)}</span></span>`;
  const rowCss = 'padding:8px 0;border-top:1px solid var(--line);margin-top:8px';
  const ask = async (msg, body, done) => { if (!confirm(msg)) return; await api('admin/role', body); toast(done); route(); };
  $('#app').innerHTML = head('관리자', isSuper() ? '관리자를 지정하거나 해제하고, 최고 관리자 자리를 넘길 수 있습니다.' : '관리자 지정은 최고 관리자만 할 수 있습니다.') + `
    <div style="display:grid;gap:16px;max-width:760px">
      <div class="box"><b>최고 관리자</b>
        <div class="inline" style="${rowCss}">${sup ? who(sup) + tag('최고 관리자', 'ok') : '<span class="muted">지금 최고 관리자가 없습니다. 서버에서 python3 council.py super 아이디 를 한 번 실행해 주십시오.</span>'}</div>
        ${isSuper() ? `<div class="inline" style="${rowCss}"><span class="muted" style="flex:1 0 100%;font-size:13px">자리를 넘기면 본인은 일반 관리자가 되며, 되돌리려면 받은 사람이 다시 넘겨야 합니다.</span>
          <select class="in" id="to" aria-label="넘길 회원" style="flex:1 1 200px"><option value="">넘길 회원 고르기</option>${all.filter(u => u.role !== 'super').map(u => `<option value="${u.id}">${esc(u.name)} (${esc(u.student_id)})</option>`).join('')}</select>
          <button class="btn red" id="hand">최고 관리자 넘기기</button></div>` : ''}</div>
      <div class="box"><b>관리자 <span class="muted">${admins.length}명</span></b>
        ${admins.map(u => `<div class="inline" style="${rowCss}">${who(u)}${isSuper() ? `<button class="btn red xs" data-off="${u.id}">관리자 해제</button>` : ''}</div>`).join('') || '<p class="muted" style="margin:8px 0 0">아직 관리자가 없습니다.</p>'}</div>
      ${isSuper() ? `<div class="box"><b>관리자로 지정하기</b>
        <input class="in" id="find" placeholder="이름, 학번, 아이디로 찾기" aria-label="회원 찾기" style="width:100%;margin-top:8px">
        <div id="cand"></div></div>` : ''}</div>`;
  const byId = id => all.find(u => String(u.id) === String(id));
  $$('[data-off]').forEach(b => b.onclick = () => { const u = byId(b.dataset.off); ask(`${u.name} 님의 관리자 권한을 해제하시겠습니까?`, {id: u.id, role: 'user'}, '해제했습니다'); });
  if (!isSuper()) return;
  $('#hand').onclick = async () => {
    const u = byId($('#to').value); if (!u) return toast('넘길 회원을 골라 주십시오');
    if (!confirm(`${u.name} 님에게 최고 관리자 자리를 넘기시겠습니까?\n넘기면 본인은 일반 관리자가 됩니다.`)) return;
    const pw = prompt('본인의 비밀번호를 한 번 더 입력해 주십시오'); if (!pw) return;
    await api('admin/handover', {id: u.id, password: pw}); toast(`${u.name} 님이 최고 관리자가 되었습니다`); location.reload();
  };
  const show = () => {
    const k = $('#find').value.trim().toLowerCase();
    const list = students.filter(u => !k || [u.name, u.student_id, u.username].some(v => String(v).toLowerCase().includes(k)));
    $('#cand').innerHTML = list.slice(0, 20).map(u => `<div class="inline" style="${rowCss}">${who(u)}<button class="btn line xs" data-on="${u.id}">관리자로 지정</button></div>`).join('')
      + (list.length > 20 ? `<p class="muted" style="margin:8px 0 0">${list.length - 20}명 더 있습니다. 이름이나 학번으로 좁혀 주십시오.</p>` : '')
      || '<p class="muted" style="margin:8px 0 0">찾는 학생이 없습니다.</p>';
    $$('[data-on]').forEach(b => b.onclick = () => { const u = byId(b.dataset.on); ask(`${u.name} 님을 관리자로 지정하시겠습니까?`, {id: u.id, role: 'admin'}, '지정했습니다'); });
  };
  $('#find').oninput = show; show();
});

  const isNew = m[1] === 'new';
  const [evs, nts, cur] = await Promise.all([api('admin/events'), api('admin/notices'), isNew ? null : api('admin/notice?id=' + m[1])]);
  const n = cur ? cur.notice : {kind: 'event', title: '', summary: '', body: '', chips: [], event_id: null, on_lobby: false};
  let kind = n.kind, chips = n.chips.map(c => ({...c}));
  const others = nts.notices.filter(x => x.id !== n.id);
  const targetInput = c => c.type === 'tab'
    ? `<select class="in" data-k="target">${Object.entries(TABS).map(([k, t]) => `<option value="${k}" ${c.target === k ? 'selected' : ''}>${t}</option>`).join('')}</select>`
    : c.type === 'event' ? `<select class="in" data-k="target">${evs.events.map(e => `<option value="${e.id}" ${c.target == e.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('') || '<option value="">행사가 없습니다</option>'}</select>`
    : c.type === 'notice' ? `<select class="in" data-k="target">${others.map(x => `<option value="${x.id}" ${c.target == x.id ? 'selected' : ''}>${esc(x.title)}</option>`).join('') || '<option value="">다른 공지가 없습니다</option>'}</select>`
    : `<input class="in" data-k="target" value="${esc(c.target)}" placeholder="인터넷 주소 (https://…)">`;
  const chipRows = () => chips.map((c, i) => `<div class="rowbox" data-i="${i}">
      <div class="inline"><input class="in" data-k="label" value="${esc(c.label)}" placeholder="버튼 글 (예: 세미나실 예약하기)" maxlength="30" style="flex:1">
        <button type="button" class="btn red xs" data-rm="${i}">지우기</button></div>
      <div class="inline"><select class="in" data-k="type">${[['tab', '다른 화면으로'], ['event', '행사 신청으로'], ['notice', '다른 공지로'], ['url', '바깥 주소로']].map(([v, t]) => `<option value="${v}" ${c.type === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <div style="flex:1;min-width:0;display:flex">${targetInput(c)}</div></div></div>`).join('');
  $('#app').innerHTML = `<form id="f">${head(isNew ? '공지 쓰기' : '공지 수정', '', `<a class="btn line" href="#/notices">목록으로</a><button class="btn" id="save">${isNew ? '올리기' : '저장'}</button>`)}
    <div class="write"><div style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <input class="title-in" name="title" value="${esc(n.title)}" required maxlength="100" placeholder="제목" aria-label="제목">
        <input class="sub-in" name="summary" value="${esc(n.summary)}" maxlength="100" placeholder="한 줄 소개 (목록과 로비 배너에 보입니다)" aria-label="한 줄 소개">
        <div id="ed"></div></div>
      <div class="side-set">
        <div class="box" style="display:flex;flex-direction:column;gap:10px"><div class="fld">분류<div class="seg" id="kseg">${Object.entries(KIND).reverse().map(([k, t]) => `<button type="button" data-kind="${k}">${t}</button>`).join('')}</div><span class="hint" id="khint"></span></div>
          <label class="chk"><input type="checkbox" name="on_lobby" ${n.on_lobby ? 'checked' : ''}><span>로비 맨 위에 보이기<br><span class="muted">로그인하지 않은 사람도 이 글을 읽을 수 있게 됩니다</span></span></label>
          <label class="fld">신청 현황을 같이 보여 줄 행사<select class="in" name="event_id"><option value="">없음</option>${evs.events.map(e => `<option value="${e.id}" ${n.event_id === e.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select></label></div>
        <div class="box" style="display:flex;flex-direction:column;gap:8px"><b>바로가기 버튼</b>
          <span class="muted" style="font-size:13px">글 아래에 붙는 버튼입니다. 6개까지 달 수 있습니다.</span>
          <div id="chips" style="display:flex;flex-direction:column;gap:8px"></div>
          <button type="button" class="btn line" id="addc">+ 버튼 추가</button></div></div></div></form>`;
  editor = richEditor($('#ed'), {value: n.body, draftKey: 'draft:notice:' + m[1], max: 20000});
  const hint = () => {
    $('#khint').textContent = kind === 'event' ? '행사 공지는 로그인하지 않은 사람도 읽을 수 있습니다.' : '학과 공지는 로그인한 사람만 읽을 수 있습니다.';
    $$('#kseg button').forEach(b => b.classList.toggle('on', b.dataset.kind === kind));
  };
  hint();
  $('#kseg').onclick = ev => { const b = ev.target.closest('[data-kind]'); if (b) { kind = b.dataset.kind; hint(); } };
  const sync = () => $$('#chips .rowbox').forEach(r => { const c = chips[+r.dataset.i]; r.querySelectorAll('[data-k]').forEach(x => c[x.dataset.k] = x.value); });
  const first = {tab: 'reserve', event: String(evs.events[0]?.id ?? ''), notice: String(others[0]?.id ?? ''), url: ''};
  const redraw = () => { $('#chips').innerHTML = chipRows(); $('#addc').disabled = chips.length >= 6; };
  $('#chips').onchange = ev => { sync(); if (ev.target.dataset.k === 'type') { const c = chips[+ev.target.closest('.rowbox').dataset.i]; c.target = first[c.type]; redraw(); } };
  $('#chips').onclick = ev => { const b = ev.target.closest('[data-rm]'); if (b) { sync(); chips.splice(+b.dataset.rm, 1); redraw(); } };
  $('#addc').onclick = () => { sync(); chips.push({label: '', type: 'tab', target: 'reserve'}); redraw(); };
  redraw();
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); sync();
    if (editor.tooLong) return toast('본문은 2만 자까지 쓸 수 있습니다');
    const fd = new FormData(ev.target);
    await api('admin/notice_save', {id: isNew ? undefined : n.id, kind, title: fd.get('title'), summary: fd.get('summary'), body: editor.value,
      event_id: fd.get('event_id') || null, on_lobby: !!fd.get('on_lobby'), chips});
    editor.clearDraft(); toast(isNew ? '올렸습니다' : '저장했습니다'); location.hash = '#/notices';
  };
});

// ── 행사 쓰기 ─────────────────────────────────────────────────────────
on(/^\/event\/(new|\d+)$/, async m => {
  const list = m[1] === 'new' ? null : (await api('admin/events')).events.find(e => e.id === +m[1]);
  if (m[1] !== 'new' && !list) { toast('없는 행사입니다'); return location.replace('#/events'); }
  const e = list || {title: '', body: '', starts_at: '', deadline: '', on_lobby: true, fields: [], n: 0};
  let fields = e.fields.map(f => ({...f, options: [...(f.options || [])]}));
  const TYPES = [['text', '단답형'], ['long', '장문형'], ['select', '객관식'], ['multi', '체크박스'], ['dropdown', '드롭다운']];
  const typesFor = f => f.type === 'checkbox' ? [...TYPES, ['checkbox', '체크 한 칸 (예전 방식)']] : TYPES;
  const hasOpts = f => ['select', 'multi', 'dropdown'].includes(f.type);
  const prev = {text: '단답형 텍스트', long: '장문형 텍스트', checkbox: '학생이 칸에 체크합니다'};
  const fieldRows = () => fields.length ? fields.map((f, i) => `<div class="qcard" data-i="${i}">
      <div class="qtop"><input class="qtitle" data-k="label" value="${esc(f.label)}" maxlength="100" placeholder="질문 (예: 티셔츠 사이즈)" aria-label="질문 ${i + 1}">
        <select class="in" data-k="type" aria-label="답하는 방식">${typesFor(f).map(([v, t]) => `<option value="${v}" ${f.type === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      ${hasOpts(f) ? `<div class="qopts">${f.options.map((o, j) => `<div class="qopt">${f.type === 'dropdown' ? `<span class="qn">${j + 1}</span>` : `<i class="${f.type}"></i>`}<input data-o="${j}" value="${esc(o)}" maxlength="100" placeholder="보기 ${j + 1}" aria-label="보기 ${j + 1}"><button type="button" data-orm="${j}" aria-label="보기 ${j + 1} 지우기">✕</button></div>`).join('')}
        <button type="button" class="qadd" data-oadd>${f.type === 'dropdown' ? '<span class="qn"></span>' : `<i class="${f.type}"></i>`}보기 추가</button></div>` : `<div class="qprev">${prev[f.type]}</div>`}
      <div class="qbar"><label class="sw"><input type="checkbox" data-k="required" ${f.required ? 'checked' : ''}>필수 질문</label><span class="sp"></span>
        <button type="button" class="ib" data-up="${i}" ${i ? '' : 'disabled'}>↑ 위로</button>
        <button type="button" class="ib" data-down="${i}" ${i < fields.length - 1 ? '' : 'disabled'}>↓ 아래로</button>
        <button type="button" class="ib" data-dup="${i}">복사</button>
        <button type="button" class="ib del" data-rm="${i}">지우기</button></div></div>`).join('')
    : '<div class="muted" style="font-size:13px;padding:6px 0">아직 질문이 없습니다. 이름·학번·이메일만 받습니다.</div>';
  $('#app').innerHTML = `<form id="f">${head(list ? '행사 수정' : '새 행사', '', `<a class="btn line" href="#/events">목록으로</a><button class="btn">저장</button>`)}
    <div class="write"><div style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <input class="title-in" name="title" value="${esc(e.title)}" required maxlength="100" placeholder="행사 이름" aria-label="행사 이름">
        <div id="ed"></div></div>
      <div class="side-set">
        <div class="box" style="display:flex;flex-direction:column;gap:10px">
          <label class="fld">행사 일시 (없으면 비워 두십시오)<input class="in" type="datetime-local" name="starts_at" value="${e.starts_at}"><span class="hint" data-for="starts_at">${dtHint(e.starts_at)}</span></label>
          <label class="fld">신청 마감<input class="in" type="datetime-local" name="deadline" value="${e.deadline}" required><span class="hint" data-for="deadline">${dtHint(e.deadline)}</span></label>
          <label class="fld">정원 (비워 두면 제한 없음)<input class="in" type="number" name="capacity" min="1" value="${e.capacity ?? ''}" placeholder="제한 없음"></label>
          <label class="chk"><input type="checkbox" name="show_count" ${e.show_count === 0 ? '' : 'checked'}><span>신청 인원을 학생에게 보이기<br><span class="muted">끄면 인원 대신 '신청 받는 중'만 보입니다</span></span></label>
          <label class="chk"><input type="checkbox" name="on_lobby" ${e.on_lobby ? 'checked' : ''}><span>로비에 보이기</span></label>
          <label class="chk"><input type="checkbox" name="dues_only" ${e.dues_only ? 'checked' : ''}><span>학생회비 납부자만 신청 받기<br><span class="muted">미납부자에게는 신청서 대신 안내 문구가 보입니다. 회원 메뉴에서 납부자를 표시하십시오.</span></span></label></div>
        <div class="box" style="display:flex;flex-direction:column;gap:10px"><b>신청서에 더 물어볼 것</b>
          <span class="muted" style="font-size:13px">이름·학번·이메일은 계정에서 자동으로 들어갑니다.</span>
          ${e.n ? '<span style="font-size:13px;color:var(--req)">이미 신청한 사람이 있습니다. 순서를 바꿔도 받아 둔 답은 그대로 따라가지만, 질문을 지우면 그 질문의 답도 함께 지워집니다.</span>' : ''}
          <div id="fields" style="display:flex;flex-direction:column;gap:8px">${fieldRows()}</div>
          <button type="button" class="btn line" id="addf" style="height:38px">+ 질문 추가</button></div></div></div></form>`;
  editor = richEditor($('#ed'), {value: e.body, draftKey: 'draft:event:' + m[1], max: 5000, placeholder: '행사 설명을 쓰십시오'});
  $('#f').addEventListener('input', ev => { const h = $(`[data-for="${ev.target.name}"]`); if (h) h.textContent = dtHint(ev.target.value); });
  const sync = () => $$('#fields .qcard').forEach(r => { const f = fields[+r.dataset.i];
    r.querySelectorAll('[data-k]').forEach(x => f[x.dataset.k] = x.type === 'checkbox' ? x.checked : x.value);
    if (hasOpts(f)) f.options = [...r.querySelectorAll('[data-o]')].map(x => x.value); });
  const redraw = focus => { $('#fields').innerHTML = fieldRows(); if (focus) $(focus)?.focus(); };
  const card = i => `#fields .qcard[data-i="${i}"]`;
  $('#fields').onchange = ev => { sync(); if (ev.target.dataset.k === 'type') { const f = fields[+ev.target.closest('.qcard').dataset.i]; if (hasOpts(f) && !f.options.length) f.options = ['']; redraw(); } };
  $('#fields').onkeydown = ev => { const o = ev.target.dataset.o; if (o === undefined || ev.key !== 'Enter') return; ev.preventDefault();
    sync(); const i = +ev.target.closest('.qcard').dataset.i; fields[i].options.splice(+o + 1, 0, ''); redraw(`${card(i)} [data-o="${+o + 1}"]`); };
  $('#fields').onclick = ev => { const t = ev.target.closest('button'); if (!t) return; sync(); const d = t.dataset;
    if (d.rm !== undefined) { fields.splice(+d.rm, 1); redraw(); }
    else if (d.dup !== undefined) { const f = fields[+d.dup]; fields.splice(+d.dup + 1, 0, {...f, id: undefined, options: [...f.options]});      // 복제본은 새 질문이라 번호를 따로 받는다
       redraw(`${card(+d.dup + 1)} [data-k="label"]`); }
    else if (d.up !== undefined) { const i = +d.up; [fields[i - 1], fields[i]] = [fields[i], fields[i - 1]]; redraw(`${card(i - 1)} [data-up]`); }
    else if (d.down !== undefined) { const i = +d.down; [fields[i + 1], fields[i]] = [fields[i], fields[i + 1]]; redraw(`${card(i + 1)} [data-down]`); }
    else if (d.oadd !== undefined) { const i = +t.closest('.qcard').dataset.i; fields[i].options.push(''); redraw(`${card(i)} [data-o="${fields[i].options.length - 1}"]`); }
    else if (d.orm !== undefined) { const i = +t.closest('.qcard').dataset.i; fields[i].options.splice(+d.orm, 1); redraw(); } };
  $('#addf').onclick = () => { sync(); fields.push({label: '', type: 'text', required: false, options: []}); redraw(`${card(fields.length - 1)} [data-k="label"]`); $(card(fields.length - 1))?.scrollIntoView({block: 'center', behavior: 'smooth'}); };
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); sync();
    if (editor.tooLong) return toast('설명은 5천 자까지 쓸 수 있습니다');
    const bad = fields.findIndex(f => !f.label.trim() || (hasOpts(f) && !f.options.some(o => o.trim())));
    if (bad >= 0) { $(card(bad))?.scrollIntoView({block: 'center'}); return toast(!fields[bad].label.trim() ? `${bad + 1}번 질문의 내용을 적어 주십시오` : `${bad + 1}번 질문의 보기를 적어 주십시오`); }
    const fd = new FormData(ev.target);
    await api('admin/event_save', {id: list?.id, title: fd.get('title'), body: editor.value, starts_at: fd.get('starts_at'),
      deadline: fd.get('deadline'), on_lobby: !!fd.get('on_lobby'), capacity: fd.get('capacity') || null, show_count: !!fd.get('show_count'), dues_only: !!fd.get('dues_only'),
      fields: fields.map(f => ({...f, options: hasOpts(f) ? f.options.map(o => o.trim()).filter(Boolean) : []}))});
    editor.clearDraft(); toast('저장했습니다'); location.hash = '#/events';
  };
});

// ── 시작 ──────────────────────────────────────────────────────────────
api('me').then(d => {
  me = d.user;
  if (!me) return toLogin();
  if (me.role !== 'admin' && me.role !== 'super') {
    const sh = document.querySelector('.shell'); sh.style.display = 'block';
    sh.innerHTML = `<div class="gate box"><h1 style="margin-bottom:8px">관리자만 쓸 수 있습니다</h1>
      <p class="muted">${esc(me.name)} 님의 계정은 관리자 권한이 없습니다.</p><a class="btn" href="./">학생 사이트로</a></div>`;
    return;
  }
  route();
});
</script>
</body>
</html>
