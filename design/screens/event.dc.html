<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SWITCH 행사 상세와 신청서</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1D1D1F}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 402px; height: 1560px; position: relative; overflow: hidden; background: {{ground}}; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.47; -webkit-font-smoothing: antialiased">

  <header style="display: flex; align-items: center; height: 52px; padding: 0 12px 0 8px; border-bottom: 1px solid rgba(0,0,0,.06)">
    <a href="S3-lobby.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 8px; font-size: 17px; text-decoration: none; color: #1D1D1F">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg>행사</a>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px; padding: 24px 16px 0">

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6E6E73">
        <sc-if value="{{notApplied}}" hint-placeholder-val="{{true}}">
          <span style="padding: 2px 10px; border-radius: 99px; background: #FFFFFF; color: #1D1D1F; font-weight: 500">모집 중</span>
        </sc-if>
        <sc-if value="{{applied}}" hint-placeholder-val="{{false}}">
          <span style="padding: 2px 10px; border-radius: 99px; background: #1D1D1F; color: #FFFFFF; font-weight: 500">신청함</span>
        </sc-if>
        <span>마감까지 9일</span>
      </div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.8px; line-height: 1.25; text-wrap: balance">학과의 날 운동회</h1>
    </div>

    <section aria-label="신청 현황" style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 22px; background: #FFFFFF">
      <div style="display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums">
        <span style="font-size: 30px; font-weight: 700; letter-spacing: -.8px">{{count}}</span>
        <span style="font-size: 15px; color: #6E6E73">/ 정원 60명</span>
        <span style="margin-left: auto; font-size: 13px; color: #6E6E73">{{left}}</span>
      </div>
      <div role="progressbar" aria-label="신청 인원" aria-valuemin="0" aria-valuemax="60" aria-valuenow="{{countNum}}" style="height: 8px; border-radius: 99px; background: rgba(0,0,0,.07); overflow: hidden">
        <div style="width: {{pct}}; height: 100%; border-radius: 99px; background: #1D1D1F"></div>
      </div>
    </section>

    <section aria-label="행사 정보" style="border-radius: 18px; background: #FFFFFF; padding: 6px 20px">
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,.06); font-size: 15px">
        <span style="color: #6E6E73">일시</span><span>11월 20일 (금) 오후 1시</span>
      </div>
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,.06); font-size: 15px">
        <span style="color: #6E6E73">장소</span><span>[장소]</span>
      </div>
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 0; font-size: 15px">
        <span style="color: #6E6E73">신청 마감</span><span>11월 14일 (토) 밤 11:59</span>
      </div>
    </section>

    <article style="padding: 22px; border-radius: 22px; background: #FFFFFF; font-size: 16px; line-height: 1.75">
      <p style="margin: 0">4팀으로 나눠 피구·줄다리기·계주를 진행하고, 체험 부스와 승부예측 부스도 열어요. 운동을 잘 못해도 즐길 수 있게 짰어요.</p>
      <a href="N-notice.dc.html" style="margin-top: 8px; min-height: 44px; display: inline-flex; align-items: center; gap: 2px; font-size: 15px; text-decoration: none">공지 전문 보기
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg></a>
    </article>

    <section aria-label="신청서" style="display: flex; flex-direction: column; gap: 22px; padding: 24px 22px; border-radius: 22px; background: #FFFFFF">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.5px">신청서</h2>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #6E6E73">신청자</span>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: {{ground}}">
          <span style="font-size: 16px; font-weight: 500">임지원</span>
          <span style="font-size: 14px; color: #6E6E73; font-variant-numeric: tabular-nums">2026XXXXXX</span>
        </div>
        <span style="font-size: 12px; color: #6E6E73">이름·학번·이메일은 계정에서 자동으로 들어가요.</span>
      </div>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0 0 8px; font-size: 15px; font-weight: 500">가장 자신 있는 종목 <span style="color: #B3261E">*</span></legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
            <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{o.pick}}" style="height: 48px; border: 0; border-radius: 12px; background: #1D1D1F; color: #FFFFFF; font-size: 15px; font-weight: 500; font-family: inherit">{{o.label}}</button>
            </sc-if>
            <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{o.pick}}" style="height: 48px; border: 0; border-radius: 12px; background: {{ground}}; color: #1D1D1F; font-size: 15px; font-family: inherit">{{o.label}}</button>
            </sc-if>
          </sc-for>
        </div>
      </fieldset>

      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 500">같은 팀 하고 싶은 사람 <span style="font-size: 13px; font-weight: 400; color: #6E6E73">선택</span>
        <input type="text" placeholder="이름을 적어 주세요" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 12px; background: {{ground}}; color: #1D1D1F; font-size: 16px; font-family: inherit; outline: none">
      </label>

      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px">
        <input type="checkbox" checked="{{agree}}" onChange="{{toggleAgree}}" style="width: 22px; height: 22px; margin: 0; accent-color: #1D1D1F; flex: none">
        <span>개인정보 수집·이용에 동의해요 <span style="color: #B3261E">*</span></span>
      </label>

      <sc-if value="{{canSubmit}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{submit}}" style="height: 52px; border: 0; border-radius: 99px; background: #1D1D1F; color: #FFFFFF; font-size: 17px; font-family: inherit">참여 신청</button>
      </sc-if>
      <sc-if value="{{cantSubmit}}" hint-placeholder-val="{{true}}">
        <button type="button" disabled style="height: 52px; border: 0; border-radius: 99px; background: rgba(0,0,0,.06); color: #6E6E73; font-size: 16px; font-family: inherit">필수 항목을 채워 주세요</button>
      </sc-if>
      <sc-if value="{{applied}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: {{accent}}">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
            <span style="font-size: 15px">신청됐어요. 마감 전까지 고칠 수 있어요.</span>
          </div>
          <button type="button" onClick="{{edit}}" style="height: 52px; border: 0; border-radius: 99px; background: rgba(0,0,0,.06); color: #1D1D1F; font-size: 16px; font-family: inherit">신청 내용 수정</button>
        </div>
      </sc-if>
    </section>
  </main>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px; background: rgba(255,255,255,.88); border-top: 1px solid rgba(0,0,0,.08)">
    <a href="S3-lobby.dc.html" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; text-decoration: none; color: #6E6E73">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"></path></svg>로비</a>
    <a href="#" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; text-decoration: none; color: #6E6E73">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5z"></path><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"></path></svg>대여</a>
    <a href="#" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; text-decoration: none; color: #6E6E73">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>예약</a>
    <a href="#" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; text-decoration: none; color: #1D1D1F">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4M5.5 4.5h11l-2.2 4 2.2 4h-11"></path></svg>행사</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#F0F7FB","options":["#F0F7FB","#E8F3F9","#F5F5F7"]},"accent":{"editor":"color","default":"#C4E4F4","options":["#C4E4F4","#AFD6EC","#E5E5EA"]},"$preview":{"width":402,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const OPTS = ['피구', '줄다리기', '계주', '상관없음'];
    const applied = !!st.applied;
    const ready = !!st.pick && !!st.agree;
    const cap = 60;
    const n = 38 + (applied ? 1 : 0);
    return {
      ground: this.props.ground ?? '#F0F7FB',
      accent: this.props.accent ?? '#C4E4F4',
      opts: OPTS.map(o => ({ label: o, on: st.pick === o, off: st.pick !== o, pick: () => this.setState({ pick: o }) })),
      agree: !!st.agree,
      toggleAgree: e => this.setState({ agree: e.target.checked }),
      applied: applied,
      notApplied: !applied,
      canSubmit: !applied && ready,
      cantSubmit: !applied && !ready,
      submit: () => this.setState({ applied: true }),
      edit: () => this.setState({ applied: false }),
      count: n + '명',
      countNum: n,
      left: (cap - n) + '자리 남음',
      pct: Math.round(n / cap * 100) + '%'
    };
  }
}
</script>
</body>
</html>
