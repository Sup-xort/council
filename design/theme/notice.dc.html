<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SWITCH 공지 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.47; -webkit-font-smoothing: antialiased">

  <header style="display: flex; align-items: center; height: 52px; padding: 0 12px 0 8px; border-bottom: 1px solid {{t.line}}">
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 8px; font-size: 17px; text-decoration: none; color: {{t.ink}}">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg>공지</a>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px; padding: 24px 16px 0">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{t.sub}}">
        <span style="padding: 2px 10px; border-radius: 99px; background: {{t.card}}; color: {{t.ink}}; font-weight: 500">행사</span>
        <span>11월 5일</span>
        <span aria-hidden="true">·</span>
        <span>학생회 SWITCH</span>
      </div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.8px; line-height: 1.25; text-wrap: balance">학과의 날 운동회 안내</h1>
    </div>

    <section aria-label="핵심 정보" style="border-radius: 18px; background: {{t.card}}; padding: 6px 20px">
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid {{t.line}}; font-size: 15px">
        <span style="color: {{t.sub}}">일시</span><span>11월 20일 (금) 오후 1시</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid {{t.line}}; font-size: 15px">
        <span style="color: {{t.sub}}">장소</span><span>[장소]</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px 0; font-size: 15px">
        <span style="color: {{t.sub}}">대상</span><span>반도체융합공학과 학부생</span>
      </div>
    </section>

    <article style="display: flex; flex-direction: column; gap: 14px; padding: 24px 22px; border-radius: 22px; background: {{t.card}}; font-size: 16px; line-height: 1.75">
      <p style="margin: 0">올해 학과의 날은 운동회로 진행합니다. 운동을 잘 못해도 즐길 수 있는 종목을 섞었으니 부담 없이 신청해 주세요.</p>
      <h2 style="margin: 8px 0 0; font-size: 18px; font-weight: 600; letter-spacing: -.3px; line-height: 1.4">진행 방식</h2>
      <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px">
        <li>전체를 4팀으로 나눠 팀 점수로 종합 순위를 정해요.</li>
        <li>필수 종목: 피구, 줄다리기, 계주</li>
        <li>체험 부스 3곳과 승부예측 부스를 함께 운영해요.</li>
      </ul>
      <figure style="margin: 4px 0 0; display: flex; flex-direction: column; gap: 8px">
        <div role="img" aria-label="이미지 자리" style="aspect-ratio: 16 / 10; border-radius: 14px; background: {{t.fill}}; display: flex; align-items: center; justify-content: center; color: {{t.sub}}; font-size: 14px">[본문 이미지]</div>
        <figcaption style="font-size: 13px; color: {{t.sub}}; line-height: 1.5">이미지 설명이 있으면 여기에 들어가요.</figcaption>
      </figure>
    </article>
  </main>

  <sc-if value="{{glass}}" hint-placeholder-val="{{true}}">
    <nav style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 6px; border-radius: 32px; background: {{t.glassBg}}; border: 1px solid {{t.glassBorder}}; box-shadow: {{t.glassShadow}}; backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%)">
      <a href="Main.dc.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; background: {{t.tint}}; font-size: 10px; font-weight: 600; text-decoration: none; color: {{t.ink}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"></path></svg>로비</a>
      <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; font-size: 10px; text-decoration: none; color: {{t.navSub}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5z"></path><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"></path></svg>대여</a>
      <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; font-size: 10px; text-decoration: none; color: {{t.navSub}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>예약</a>
      <a href="Event.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; font-size: 10px; text-decoration: none; color: {{t.navSub}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4M5.5 4.5h11l-2.2 4 2.2 4h-11"></path></svg>행사</a>
    </nav>
  </sc-if>
  <sc-if value="{{flat}}" hint-placeholder-val="{{false}}">
    <nav style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px; background: {{t.barBg}}; border-top: 1px solid {{t.line}}">
      <a href="Main.dc.html" aria-current="page" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; text-decoration: none; color: {{t.ink}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"></path></svg>로비</a>
      <a href="#" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; text-decoration: none; color: {{t.sub}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5z"></path><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"></path></svg>대여</a>
      <a href="#" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; text-decoration: none; color: {{t.sub}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>예약</a>
      <a href="Event.dc.html" style="min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; text-decoration: none; color: {{t.sub}}">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4M5.5 4.5h11l-2.2 4 2.2 4h-11"></path></svg>행사</a>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"glass":{"editor":"boolean","default":true},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const LIGHT = { bg: '#F0F7FB', card: '#FFFFFF', fill: '#F0F7FB', ink: '#1D1D1F', sub: '#6E6E73', navSub: '#5E5E63', line: 'rgba(0,0,0,.06)', tint: 'rgba(0,0,0,.06)',
      glassBg: 'rgba(255,255,255,.58)', glassBorder: 'rgba(255,255,255,.75)', glassShadow: '0 10px 30px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9)', barBg: 'rgba(255,255,255,.9)' };
    const DARK = { bg: '#0D1215', card: '#182025', fill: '#222B31', ink: '#F2F5F7', sub: '#9AA3A9', navSub: '#AEB6BB', line: 'rgba(255,255,255,.08)', tint: 'rgba(255,255,255,.1)',
      glassBg: 'rgba(36,44,50,.55)', glassBorder: 'rgba(255,255,255,.12)', glassShadow: '0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1)', barBg: 'rgba(24,32,37,.94)' };
    const glass = this.props.glass ?? true;
    return { t: this.props.dark ? DARK : LIGHT, glass: glass, flat: !glass };
  }
}
</script>
</body>
</html>
