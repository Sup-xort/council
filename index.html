<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1215" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%221.5%22 y=%221.5%22 width=%2229%22 height=%2229%22 rx=%227%22 fill=%22%23FFFEFC%22 stroke=%22%2316181B%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2216%22 cy=%2211%22 r=%223.2%22 fill=%22%231E6B53%22/%3E%3Ccircle cx=%2216%22 cy=%2221%22 r=%223.2%22 fill=%22%232F5A93%22/%3E%3C/svg%3E">
<title>SWITCH · 반도체융합공학과 학생회</title>
<style>
:root{color-scheme:light dark;
  --bg:#F0F7FB;--card:#FFFFFF;--fill:#F0F7FB;--ink:#1D1D1F;--on-ink:#FFFFFF;--sub:#6E6E73;
  --line:rgba(0,0,0,.06);--tint:rgba(0,0,0,.06);--track:rgba(0,0,0,.07);--dot:rgba(0,0,0,.2);
  --busy:#C4E4F4;--busy-ink:#1D1D1F;--req:#B3261E;
  --glass-bg:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.75);--nav-sub:#48484D;
  --glass-shadow:0 10px 30px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.9);--seg-on:#FFFFFF;
  --safe-b:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1215;--card:#182025;--fill:#222B31;--ink:#F2F5F7;--on-ink:#0D1215;--sub:#9AA3A9;
  --line:rgba(255,255,255,.08);--tint:rgba(255,255,255,.1);--track:rgba(255,255,255,.12);--dot:rgba(255,255,255,.25);
  --busy:#35596B;--busy-ink:#F2F5F7;--req:#F2B8B5;
  --glass-bg:rgba(36,44,50,.85);--glass-line:rgba(255,255,255,.12);--nav-sub:#AEB6BB;
  --glass-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);--seg-on:#2C363C}}
/* 예전 이름을 쓰는 곳이 남아 있어 새 값으로 이어 둔다 */
:root{--sheet:var(--card);--muted:var(--sub);--line2:var(--tint);--green:var(--ink);--blue:var(--ink);--red:var(--req);--on:var(--on-ink);--green-t:var(--busy);--blue-t:var(--busy)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;
  font:15px/1.47 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 20px 0;background:var(--bg);border-bottom:1px solid var(--line)}
header .mark{font-size:17px;font-weight:600;letter-spacing:.2px;text-decoration:none;white-space:nowrap}
header .back{min-height:44px;display:flex;align-items:center;gap:2px;margin-left:-12px;padding:0 8px;font-size:17px;text-decoration:none}
header .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header .who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px}
header .who a{min-height:44px;display:flex;align-items:center;color:var(--sub);text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(20px + 64px + 24px + var(--safe-b))}
nav#nav{position:fixed;left:16px;right:16px;bottom:calc(20px + var(--safe-b));z-index:5;max-width:560px;margin:0 auto;
  display:flex;padding:6px;border-radius:32px;background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
nav#nav a{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:26px;font-size:10px;color:var(--nav-sub);text-decoration:none}
nav#nav a.on{background:var(--tint);color:var(--ink);font-weight:600}nav#nav a.on svg{stroke-width:1.9}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.25;text-wrap:balance}
h2{font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.2;margin:8px 4px 14px}
h3{font-size:19px;font-weight:600;letter-spacing:-.4px;margin:0 0 10px}
.card{background:var(--card);border-radius:22px;padding:20px 22px;margin-bottom:14px}
.muted{color:var(--sub);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 22px;border:0;border-radius:99px;
  background:var(--ink);color:var(--on-ink);font-weight:500;font-size:16px;cursor:pointer;text-decoration:none}
.btn.blue{background:var(--ink);color:var(--on-ink)}
.btn.ghost,.btn.line{background:var(--tint);color:var(--ink)}
.btn.red{background:var(--tint);color:var(--req)}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px;white-space:nowrap;flex:none}
.btn.sm svg.i{width:16px;height:16px}
.btn.wide{width:100%;min-height:52px;font-size:17px}.btn:disabled{background:var(--tint);color:var(--sub);cursor:default}
label.f{display:block;margin-bottom:16px;font-size:13px;color:var(--sub)}
label.f input,label.f select,label.f textarea,.in{display:block;width:100%;margin-top:8px;min-height:48px;padding:10px 14px;
  border:0;border-radius:12px;background:var(--fill);color:var(--ink);font-size:16px;outline:none}
label.f input:focus,label.f select:focus,label.f textarea:focus,.in:focus,.mde textarea:focus{box-shadow:0 0 0 2px var(--ink)}
textarea{min-height:96px!important;resize:vertical}
label.chk{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);flex:none;margin:0}
.req{color:var(--req);font-weight:400}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--tint);margin-bottom:14px}
.seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--sub);font-size:14px;cursor:pointer}
.seg button.on{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;align-items:center;gap:10px}.row>.grow{flex:1;min-width:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:500;background:var(--tint);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--busy);color:var(--busy-ink)}.pill.mine{background:var(--ink);color:var(--on-ink)}.pill.use,.pill.closed{color:var(--sub)}
.list>div{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
.note{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
/* 세미나실 주간 표 */
.wk{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:3px}
.wk .dh{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
.wk .dh b{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:400;color:var(--ink)}
.wk .dh.today b{background:var(--ink);color:var(--on-ink);border-radius:50%;font-weight:600}
.wk .hh{display:flex;align-items:center;font-size:11px;color:var(--sub);height:32px}
.wk button,.wk span.c{height:32px;border:0;border-radius:7px;padding:0}
.wk button{background:var(--fill);cursor:pointer}
.wk span.c.busy{background:var(--busy);color:var(--busy-ink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;cursor:pointer}
.wk span.c.mine{background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;white-space:nowrap;cursor:pointer}
.legend{display:flex;justify-content:center;gap:16px;padding-top:14px;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:block}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:54px;border-radius:12px;border:0;background:var(--fill);font-size:14px;line-height:1.25;padding:4px;cursor:pointer}
.slot small{display:block;font-size:11px;color:var(--sub)}
.slot.sel{background:var(--ink);color:var(--on-ink)}.slot.sel small{color:var(--on-ink);opacity:.7}
.slot.busy{background:var(--busy);color:var(--busy-ink)}.slot.busy small{color:var(--busy-ink);opacity:.7}
.slot.mine{background:var(--ink);color:var(--on-ink)}.slot.mine small{color:var(--on-ink);opacity:.7}
.slot:disabled{cursor:default}.slot:disabled:not(.busy):not(.mine){opacity:.35}
/* 결과 화면 (QR) */
.result{text-align:center;padding:64px 24px 36px;background:none;margin:0}
.result .big{display:inline-flex;width:76px;height:76px;border-radius:50%;background:var(--busy);color:var(--busy-ink);align-items:center;justify-content:center}
.result .big.mute{background:var(--tint);color:var(--sub)}
.result .big svg.i{width:36px;height:36px;stroke-width:2}
.result h2{font-size:30px;margin:24px 0 0}.result .nm{margin:6px 0 0;font-size:19px;font-weight:500}
.result .muted{max-width:280px;margin:14px auto 0;font-size:15px;text-wrap:pretty}
.result .btn{margin-top:44px;width:100%;min-height:50px}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);
  padding:10px 16px;border-radius:99px;font-size:14px;z-index:9;max-width:90vw}
.fieldrow{background:var(--fill);border-radius:14px;padding:12px;margin-bottom:10px}
.fieldrow .in{background:var(--card)}
.cols{display:grid;gap:14px}
@media (min-width:820px){
  main{padding-top:28px}.cols{grid-template-columns:1.6fr 1fr}.cols.even{grid-template-columns:1fr 1fr}
  .slots{grid-template-columns:repeat(6,1fr)}
}
.authbox{max-width:400px;margin:28px auto}
.authbox .brand{text-align:center;margin-bottom:22px}.authbox .mark{display:block;font-size:44px;font-weight:700;letter-spacing:-1px;text-decoration:none;margin-bottom:8px}
table.apps{width:100%;border-collapse:collapse;font-size:13px}table.apps td,table.apps th{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}
table.apps th{color:var(--sub);font-weight:500}
.scroll-x{overflow-x:auto}
/* 화면 머리말: 작은 글씨 줄 + 큰 제목 */
.head{display:flex;flex-direction:column;gap:10px;padding:8px 4px 0;margin-bottom:6px}
.head .meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--sub)}
.head .meta .pill{background:var(--card);color:var(--ink)}.head .meta .pill.mine{background:var(--ink);color:var(--on-ink)}
.kicker{font-size:13px;color:var(--sub)}
.big-title{margin:0;font-size:32px;font-weight:700;letter-spacing:-.9px;line-height:1.15}
.rows{background:var(--card);border-radius:18px;padding:6px 20px;margin-bottom:14px}
.rows>div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows>div:last-child{border:0}.rows>div>span:first-child{color:var(--sub)}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.rb{width:44px;height:44px;border:0;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.rb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.txt{width:auto;padding:0 14px;border-radius:99px;font-size:14px}
/* 배너 */
.banner{height:196px;border-radius:22px;background:var(--card);overflow:hidden;touch-action:pan-y}
.banner article{height:100%;display:flex;flex-direction:column;gap:6px;padding:26px 24px 14px}
.banner h2{margin:0;font-size:26px;letter-spacing:-.7px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.banner p{margin:0;font-size:15px;color:var(--sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.banner .go{margin-top:auto;display:flex;align-items:center;gap:14px}
.banner .go a{min-height:44px;display:flex;align-items:center;gap:2px;font-size:15px;text-decoration:none}
.banner .go a.pb{min-height:36px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:14px}
.dots{display:flex;justify-content:center}
.dots button{width:24px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dot)}.dots .on i{background:var(--ink)}
/* 행사 목록 카드 */
.ev{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ev h3{margin:0}.ev .when{font-size:14px;color:var(--sub)}
.ev .acts{display:flex;align-items:center;gap:16px;padding-top:8px}
.pb{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:14px;text-decoration:none;border:0}
.pb.soft{background:var(--tint);color:var(--ink)}
.lk{min-height:44px;display:flex;align-items:center;gap:2px;font-size:14px;text-decoration:none}
.evdone{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 22px;color:var(--sub);text-decoration:none;border-top:1px solid var(--line)}
.evlist{border-radius:22px;background:var(--card);overflow:hidden;margin-bottom:14px}.evlist>.ev:last-child{border-bottom:0}
.g{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.g .t{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}.g .t b{color:var(--ink);font-weight:600}
.gauge{height:6px;border-radius:99px;background:var(--track);overflow:hidden}.gauge i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.gbig{display:flex;flex-direction:column;gap:10px}
.gbig .n{display:flex;align-items:baseline;gap:6px}.gbig .n b{font-size:30px;font-weight:700;letter-spacing:-.8px}.gbig .n span{font-size:15px;color:var(--sub)}.gbig .n em{margin-left:auto;font-style:normal;font-size:13px;color:var(--sub)}
.gbig .gauge{height:8px}
.lock{text-align:center;padding:28px 22px}.lock h3{margin-bottom:6px}.lock .row{justify-content:center;margin-top:16px}
/* 신청서 */
.apply{display:flex;flex-direction:column;gap:22px;padding:24px 22px}.apply h2{margin:0;font-size:22px;letter-spacing:-.5px}
.apply .who{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--fill)}
.apply .who b{font-size:16px;font-weight:500}.apply .who span{font-size:14px;color:var(--sub)}
.apply fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px}
.apply legend,.apply .lab{padding:0 0 8px;font-size:15px;font-weight:500}.apply .lab{padding:0}
.apply label.t{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
.apply label.t input{height:48px;padding:0 14px;border:0;border-radius:12px;background:var(--fill);font-size:16px;font-weight:400;outline:none}
.apply label.t input:focus{box-shadow:0 0 0 2px var(--ink)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{height:48px;border:0;border-radius:12px;background:var(--fill);font-size:15px;cursor:pointer}
.opts button[aria-pressed=true]{background:var(--ink);color:var(--on-ink);font-weight:500}
.done{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--busy);color:var(--busy-ink);font-size:15px}
.apply .btn{min-height:52px;font-size:17px}
/* 공지 */
.nrow{display:block;text-decoration:none;background:var(--card);border-radius:22px;padding:18px 22px;margin-bottom:12px}
.nrow h3{margin:8px 0 0}
.pn{border-radius:18px;background:var(--card);overflow:hidden}
.pn a{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;min-height:56px;padding:0 20px;text-decoration:none}
.pn a+a{border-top:1px solid var(--line)}.pn small{font-size:13px;color:var(--sub)}.pn b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:99px;background:var(--tint);text-decoration:none;font-size:15px}
.linked{display:flex;flex-direction:column;gap:6px}.linked .pb{align-self:stretch;justify-content:center;min-height:48px;margin-top:10px;font-size:16px}
/* 대여 */
.kind{padding:12px 0;border-top:1px solid var(--line)}.kind:first-of-type{border-top:0}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.num{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;background:var(--tint);color:var(--sub)}
.num.ok{background:var(--busy);color:var(--busy-ink)}.num.mine{background:var(--ink);color:var(--on-ink)}
/* 본문 서식 */
.md{font-size:16px;line-height:1.75;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 14px}.md h3{font-size:18px;font-weight:600;letter-spacing:-.3px;line-height:1.4;margin:22px 0 8px}.md h4{font-size:16px;font-weight:600;margin:18px 0 6px}.md h5{font-size:15px;font-weight:600;margin:14px 0 4px}
.md ul,.md ol{margin:0 0 14px;padding-left:20px}.md li{margin:3px 0}
.md blockquote{margin:0 0 14px;padding:12px 16px;border-radius:14px;background:var(--fill);font-size:15px;line-height:1.6}.md blockquote p:last-child{margin:0}
.md code{font:14px ui-monospace,Menlo,monospace;background:var(--fill);padding:1px 5px;border-radius:5px}
.md pre{margin:0 0 14px;padding:12px 14px;background:var(--fill);border-radius:14px;overflow-x:auto}.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.md a{text-decoration:underline;text-underline-offset:3px}.md a.chip{text-decoration:none}.md img{max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;display:block;margin:0 0 14px}
/* 글쓰기 도구 */
.mde{border-radius:14px;background:var(--fill);overflow:hidden}
.mde-bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--line)}
.mde-bar button{min-height:44px;min-width:44px;padding:0 12px;border:0;border-radius:99px;background:none;color:var(--ink);font-size:14px;cursor:pointer;white-space:nowrap}
.mde-bar button:hover,.mde-bar button:active{background:var(--tint)}
.mde-bar .tabs{display:flex;gap:2px;border-radius:99px;padding:2px;background:var(--tint)}
.mde-bar .tabs button{color:var(--sub)}.mde-bar .tabs button.on{background:var(--ink);color:var(--on-ink)}
.mde textarea{display:block;width:100%;min-height:320px!important;border:0;outline:none;padding:14px;background:transparent;font-size:16px;line-height:1.7;resize:vertical;margin:0;border-radius:0}
.mde textarea:focus{box-shadow:none}
.mde-prev{padding:14px;min-height:320px;background:var(--card)}.mde.pv textarea{display:none}.mde:not(.pv) .mde-prev{display:none}
.mde-foot{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.mde-help{margin-top:8px;font-size:14px;color:var(--sub)}.mde-help summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.mde-help table{border-collapse:collapse;width:100%;margin-top:6px}.mde-help td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
.mde-help td:first-child{font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap;width:48%}
@media (min-width:820px){

}

</head>
<body>
<header></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null;
const isAdmin = () => me && (me.role === 'admin' || me.role === 'super');
const DAYS = ['월','화','수','목','금','토','일'];
// 테두리만 있는 단색 아이콘 — stroke 가 글자색을 따른다
const ICON = {
  home: '<path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/>',
  box: '<path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  flag: '<path d="M5.5 21V4M5.5 4.5h11l-2.2 4 2.2 4h-11"/>',
  gear: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  back: '<path d="M9 6.5 4.5 11 9 15.5"/><path d="M5 11h9.5a5 5 0 0 1 0 10H12"/>',
  stop: '<circle cx="12" cy="12" r="7.5"/><path d="m6.8 17.2 10.4-10.4"/>',
  alert: '<path d="M12 6.5v7M12 17v.5"/>',
  qr: '<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M13.5 13.5h3v3h-3zM20.5 13.5v.01M17 20.5h3.5V17"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  doc: '<path d="M6 3.5h8l4.5 4.5v12a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4.5M8.5 12.5h7M8.5 16h7"/>',
};
const icon = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return iso(d); };
const fmt = s => s ? s.replace('T', ' ') : '';

// ── 마크다운 (직접 만든 작은 변환기) ─────────────────────────────────
// 먼저 전부 이스케이프한 뒤 우리가 만든 태그만 넣는다 — 글에 <script> 를 써도 글자로만 나온다.
// 링크는 https / http / mailto / 사이트 안 주소만, 그림은 https 만 허용한다.
const safeUrl = u => /^(https?:\/\/|mailto:|#\/)/i.test(u);
const mdLink = (u, a) => /^#\//.test(u) || /^mailto:/i.test(u)
  ? `<a href="${u}">${a}</a>` : `<a href="${u}" target="_blank" rel="noopener noreferrer">${a}</a>`;
function mdInline(raw) {
  const stash = [], keep = h => '\u0001' + (stash.push(h) - 1) + '\u0001';
  let t = esc(String(raw).replace(/\u0001/g, ''));
  t = t.replace(/`([^`]+)`/g, (_, c) => keep(`<code>${c}</code>`));
  t = t.replace(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g, (_, a, u) => keep(`<img src="${u}" alt="${a}" loading="lazy">`));
  t = t.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, (m, a, u) => safeUrl(u) ? keep(mdLink(u, a)) : m);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, p, u) => p + keep(mdLink(u, u)));   // 주소만 붙여 넣어도 링크
  t = t.replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`)
       .replace(/~~(.+?)~~/g, '<del>$1</del>')
       .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
       .replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
  for (let k = 0; k < 3 && /\u0001/.test(t); k++) t = t.replace(/\u0001(\d+)\u0001/g, (_, i) => stash[+i]);
  return t;
}
function md(src) {
  const L = String(src ?? '').replace(/\r/g, '').split('\n'), out = [];
  const LI = /^\s*([-*+]|\d+[.)])\s+/;
  const block = l => /^#{1,3}\s/.test(l) || LI.test(l) || /^>/.test(l) || /^```/.test(l) || /^(-{3,}|\*{3,}|_{3,})\s*$/.test(l);
  for (let i = 0, m; i < L.length;) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    if (m = l.match(/^(#{1,3})\s+(.*)$/)) { const n = m[1].length + 2; out.push(`<h${n}>${mdInline(m[2])}</h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^>/.test(l)) {
      const buf = [];
      while (i < L.length && /^>/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`); continue;
    }
    if (LI.test(l)) {
      const ord = /^\s*\d/.test(l), items = [];
      while (i < L.length && LI.test(L[i]) && /^\s*\d/.test(L[i]) === ord) items.push(`<li>${mdInline(L[i++].replace(LI, ''))}</li>`);
      out.push(ord ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`); continue;
    }
    const buf = [l]; i++;
    while (i < L.length && L[i].trim() && !block(L[i])) buf.push(L[i++]);
    out.push(`<p>${buf.map(mdInline).join('<br>')}</p>`);      // 줄바꿈은 그대로 줄바꿈 — 마크다운을 몰라도 쓴 대로 보인다
  }
  return out.join('\n');
}

// ── 글쓰기 도구: 버튼으로 서식을 넣고, 미리보기로 확인한다 ────────────────
const MDE_HELP = [['# 큰 제목', '큰 제목'], ['## 작은 제목', '작은 제목'], ['**굵게**  *기울임*', '<b>굵게</b> <i>기울임</i>'], ['- 항목\n- 항목', '• 목록'],
  ['1. 첫째\n2. 둘째', '번호 목록'], ['> 인용문', '인용'], ['[글자](https://주소)', '링크'], ['![설명](https://그림주소)', '그림 (https 로 시작하는 주소만)'], ['---', '구분선']];
function mdEditor(host, {value = '', draftKey = '', max = 20000} = {}) {
  host.innerHTML = `<div class="mde"><div class="mde-bar" role="toolbar" aria-label="서식">
      <div class="tabs"><button type="button" data-t="w" class="on">쓰기</button><button type="button" data-t="p">미리보기</button></div>
      <button type="button" data-a="h1" title="큰 제목"><b>제목</b></button><button type="button" data-a="h2" title="작은 제목">소제목</button>
      <button type="button" data-a="b" title="굵게 (Ctrl+B)"><b>가</b></button><button type="button" data-a="i" title="기울임 (Ctrl+I)"><i>가</i></button>
      <button type="button" data-a="ul">• 목록</button><button type="button" data-a="ol">1. 번호</button><button type="button" data-a="q">❝ 인용</button>
      <button type="button" data-a="link" title="링크 (Ctrl+K)">링크</button><button type="button" data-a="hr">구분선</button></div>
    <div class="mde-panes"><textarea placeholder="내용을 쓰세요. 위 버튼으로 제목, 굵은 글씨, 목록을 넣을 수 있습니다." maxlength="${max}"></textarea>
      <div class="mde-prev md"></div></div>
    <div class="mde-foot"><span class="cnt"></span><span>엔터를 친 곳에서 줄이 바뀝니다</span></div></div>
    <details class="mde-help"><summary>서식 쓰는 법</summary><p class="muted" style="margin:4px 0">위 버튼을 누르면 아래 표시가 알아서 들어갑니다. 직접 입력해도 같습니다.</p>
      <table>${MDE_HELP.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${b}</td></tr>`).join('')}</table></details>`;
  const box = host.querySelector('.mde'), ta = host.querySelector('textarea'), prev = host.querySelector('.mde-prev'), cnt = host.querySelector('.cnt');
  let saved = ''; try { saved = draftKey ? localStorage.getItem(draftKey) || '' : ''; } catch {}
  ta.value = saved && saved !== value ? saved : value;
  if (saved && saved !== value) toast('저장하지 않고 나갔던 글을 다시 불러왔습니다');
  const draw = () => {
    prev.innerHTML = ta.value.trim() ? md(ta.value) : '<p class="muted">아직 쓴 내용이 없습니다.</p>';
    cnt.textContent = `${ta.value.length.toLocaleString()} / ${max.toLocaleString()}자`;
  };
  const put = (s, e, text, a, b) => {               // execCommand 로 넣어야 되돌리기(Ctrl+Z)가 된다
    ta.focus(); ta.setSelectionRange(s, e);
    if (!document.execCommand('insertText', false, text)) { ta.setRangeText(text, s, e, 'end'); ta.dispatchEvent(new Event('input')); }
    ta.setSelectionRange(a, b);
  };
  const wrap = (b, a, ph) => {
    const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s, e);
    if (v.slice(s - b.length, s) === b && v.slice(e, e + a.length) === a) return put(s - b.length, e + a.length, sel, s - b.length, s - b.length + sel.length);
    const x = sel || ph; put(s, e, b + x + a, s + b.length, s + b.length + x.length);
  };
  const MARK = {h1: [/^#\s+/, () => '# '], h2: [/^##\s+/, () => '## '], ul: [/^[-*+]\s+/, () => '- '], ol: [/^\d+[.)]\s+/, i => `${i + 1}. `], q: [/^>\s?/, () => '> ']};
  const lines = k => {
    const [re, make] = MARK[k], v = ta.value;
    const s = v.lastIndexOf('\n', ta.selectionStart - 1) + 1;
    let e = v.indexOf('\n', ta.selectionEnd); if (e < 0) e = v.length;
    const ls = v.slice(s, e).split('\n'), on = ls.filter(l => l.trim()).every(l => re.test(l));
    const strip = l => l.replace(k[0] === 'h' ? /^#{1,3}\s+/ : re, '');
    let n = 0; const res = ls.map(l => !l.trim() ? l : on ? strip(l) : make(n++) + strip(l)).join('\n');
    put(s, e, res, s, s + res.length);
  };
  const act = {
    b: () => wrap('**', '**', '굵은 글씨'), i: () => wrap('*', '*', '기울인 글씨'),
    h1: () => lines('h1'), h2: () => lines('h2'), ul: () => lines('ul'), ol: () => lines('ol'), q: () => lines('q'),
    hr: () => { const s = ta.selectionEnd; put(s, s, '\n\n---\n\n', s + 7, s + 7); },
    link: () => {
      const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
      if (/^https?:\/\/\S+$/.test(sel)) return put(s, e, `[링크 설명](${sel})`, s + 1, s + 6);
      const txt = sel || '링크 설명', ins = `[${txt}](https://)`, u = s + txt.length + 3;
      put(s, e, ins, u, u + 8);
    },
  };
  box.querySelector('.mde-bar').onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.t) { box.classList.toggle('pv', b.dataset.t === 'p'); box.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); draw(); return; }
    act[b.dataset.a](); draw();
  };
  ta.addEventListener('keydown', ev => {
    if (ev.isComposing) return;                        // 한글 조합 중에는 건드리지 않는다
    const mod = ev.ctrlKey || ev.metaKey, k = ev.key.toLowerCase();
    if (mod && 'bik'.includes(k) && !ev.shiftKey) { ev.preventDefault(); act[{b: 'b', i: 'i', k: 'link'}[k]](); return; }
    if (ev.key !== 'Enter' || ev.shiftKey || mod || ta.selectionStart !== ta.selectionEnd) return;
    const v = ta.value, p = ta.selectionStart, s = v.lastIndexOf('\n', p - 1) + 1;
    const m = v.slice(s, p).match(/^(\s*)([-*+]|(\d+)[.)])\s+(.*)$/);   // 목록에서 엔터 → 다음 항목, 빈 항목에서 엔터 → 목록 끝
    if (!m) return;
    ev.preventDefault();
    if (!m[4]) return put(s, p, '', s, s);
    const next = m[3] ? `${+m[3] + 1}. ` : m[2] + ' ';
    put(p, p, '\n' + m[1] + next, p + 1 + m[1].length + next.length, p + 1 + m[1].length + next.length);
  });
  ta.addEventListener('input', () => {
    draw(); try { if (draftKey) localStorage.setItem(draftKey, ta.value); } catch {}
  });
  draw();
  return {get value() { return ta.value; }, clearDraft() { try { localStorage.removeItem(draftKey); } catch {} }};
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}

async function api(path, body) {
  const r = await fetch('api/' + path, body === undefined ? {} :
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({error: '서버 응답 오류'}));
  if (r.status === 401 && path !== 'login') { me = null; goLogin(); throw new Error(d.error); }
  if (!r.ok) { toast(d.error || '오류'); throw new Error(d.error); }
  return d;
}
function goLogin() { location.hash = '#/login?next=' + encodeURIComponent(location.hash || '#/'); }

function renderChrome(route) {
  const back = /^\/notice\/\d+$/.test(route) ? ['#/notices', '공지'] : /^\/event\/\d+$/.test(route) ? ['#/events', '행사'] : null;
  $('header').innerHTML = (back
    ? `<a class="back" href="${back[0]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>${back[1]}</a>`
    : '<a class="mark" href="#/">SWITCH</a>')
    + `<div class="who" id="who">${me ? `<span>${esc(me.name)}</span><a href="#/logout">로그아웃</a>` : '<a href="#/login">로그인</a>'}</div>`;
  const tabs = [['#/','home','로비'],['#/notices','doc','공지','/notice'],['#/items','box','대여'],['#/reserve','cal','예약'],['#/events','flag','행사','/event']];
  if (isAdmin()) tabs.push(['#/admin','gear','관리']);
  $('#nav').innerHTML = tabs.map(([h,i,t,pre]) =>
    `<a href="${h}" class="${(route === h.slice(1) || (h !== '#/' && route.startsWith(pre || h.slice(1)))) ? 'on' : ''}">${icon(i)}${t}</a>`).join('');
}

// ── 라우터 ────────────────────────────────────────────────────────────
const routes = [];
const on = (re, fn, needLogin) => routes.push({re, fn, needLogin});
// 화면 그리기는 한 번에 하나씩 순서대로 — 앞 화면의 응답이 늦게 와서 새 화면을 덮어쓰는 일이 없다.
// 기다리는 사이에 또 옮겼다면 중간 화면은 건너뛴다.
let routeSeq = 0, routeChain = Promise.resolve();
function route() {
  const my = ++routeSeq;
  routeChain = routeChain.then(() => my === routeSeq ? drawRoute() : null).catch(() => {});
  return routeChain;
}
async function drawRoute() {
  const hash = location.hash.slice(1) || '/';
  const [path, qs] = hash.split('?');
  const q = new URLSearchParams(qs || '');
  renderChrome(path);
  for (const r of routes) {
    const m = path.match(r.re);
    if (!m) continue;
    if (r.needLogin && !me) return goLogin();
    window.scrollTo(0, 0);
    try { await r.fn(m, q); } catch (e) { console.error(e); }
    return;
  }
  location.hash = '#/';
}
addEventListener('hashchange', route);

// ── 로그인 / 가입 ─────────────────────────────────────────────────────
on(/^\/login$/, (m, q) => {
  const next = q.get('next') || '#/';
  $('#app').innerHTML = `<div class="authbox"><div class="brand"><a class="mark" href="#/">SWITCH</a><span class="muted">반도체융합공학과 학생회</span></div><div class="card">
    <h2>로그인</h2>
    <form id="f"><label class="f">아이디<input name="username" autocomplete="username" autocapitalize="off" required></label>
    <label class="f">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn wide">로그인</button></form>
    <p class="muted" style="text-align:center">처음이신가요? <a href="#/signup?next=${encodeURIComponent(next)}">회원가입</a> · <a href="#/forgot">아이디·비밀번호 찾기</a></p></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('login', Object.fromEntries(new FormData(e.target)));
    me = d.user; location.hash = next;
  };
});
on(/^\/signup$/, (m, q) => {
  const next = q.get('next') || '#/';
  $('#app').innerHTML = `<div class="authbox"><div class="card"><h2>회원가입</h2><form id="f">
    <label class="f">아이디 (영문·숫자)<input name="username" autocomplete="username" autocapitalize="off" required minlength="3"></label>
    <label class="f">이름<input name="name" autocomplete="name" required></label>
    <label class="f">학번<input name="student_id" inputmode="numeric" autocomplete="off" required></label>
    <label class="f">이메일<input name="email" type="email" autocomplete="email" required></label>
    <!-- 비밀번호는 맨 끝 — 중간에 두면 iOS 자동완성이 다음 칸(이름)에도 비밀번호를 채운다 -->
    <label class="f">비밀번호 (6자 이상)<input name="password" type="password" autocomplete="new-password" required minlength="6"></label>
    <button class="btn wide">가입하고 시작하기</button></form>
    <p class="muted" style="text-align:center"><a href="#/login?next=${encodeURIComponent(next)}">이미 계정이 있어요</a></p></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('signup', Object.fromEntries(new FormData(e.target)));
    me = d.user; location.hash = next;
  };
});
on(/^\/forgot$/, () => {
  $('#app').innerHTML = `<div class="authbox"><div class="card"><h2>아이디·비밀번호 찾기</h2>
    <p class="muted">가입할 때 쓴 이메일로 아이디와 비밀번호 재설정 링크를 보내 드립니다.</p>
    <form id="f"><label class="f">이메일<input name="email" type="email" autocomplete="email" required></label>
    <button class="btn wide">메일 보내기</button></form>
    <p class="muted" style="text-align:center"><a href="#/login">로그인으로</a></p></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    await api('forgot', Object.fromEntries(new FormData(e.target)));
    $('#app').innerHTML = `<div class="card result"><div class="big" style="color:var(--green)">${icon('check')}</div>
      <h2>메일을 보냈습니다</h2><p class="muted">가입된 이메일이라면 곧 도착합니다. 안 보이면 스팸함도 확인해 주세요.</p>
      <a class="btn line" href="#/login">로그인으로</a></div>`;
  };
});
on(/^\/reset\/([\w-]+)$/, m => {
  history.replaceState(null, '', '#/reset');   // 링크 토큰을 주소창·방문기록에 남기지 않는다
  $('#app').innerHTML = `<div class="authbox"><div class="card"><h2>새 비밀번호</h2><form id="f">

const chev = '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>';
const WD = ['일','월','화','수','목','금','토'];
const koDay = d => `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
const md2 = s => s ? `${s.slice(5, 7)}.${s.slice(8, 10)}` : '';
function koWhen(s) {
  if (!s) return '';
  const d = new Date(s), h = d.getHours(), mi = d.getMinutes();
  const hh = h === 12 ? '낮 12시' : h === 0 ? '밤 12시' : h < 12 ? `오전 ${h}시` : `오후 ${h - 12}시`;
  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일 ${hh}${mi ? ` ${mi}분` : ''}`;
}
function gaugeRow(g) {
  if (!g || g.n == null) return '';
  if (g.capacity == null) return `<div class="g"><div class="t"><span><b>${g.n}명</b> 신청</span></div></div>`;
  return `<div class="g"><div class="t"><span><b>${g.n}명</b> 신청</span><span>정원 ${g.capacity}명</span></div>
    <div class="gauge" role="progressbar" aria-label="신청 인원" aria-valuemin="0" aria-valuemax="${g.capacity}" aria-valuenow="${g.n}"><i style="width:${Math.min(100, g.n / g.capacity * 100)}%"></i></div></div>`;
}
function eventsList(list) {
  const open = list.filter(e => !e.closed), done = list.filter(e => e.closed);
  if (!list.length) return '<div class="card muted">등록된 행사가 없습니다.</div>';
  return `<div class="evlist">${open.map(e => {
    const g = e.gauge, st = e.applied ? '신청함' : g.full ? '정원 마감' : '모집 중';
    return `<article class="ev"><span class="kicker">${st} · ${md2(e.deadline)} 마감</span><h3>${esc(e.title)}</h3>
      ${e.starts_at ? `<span class="when">${koWhen(e.starts_at)}</span>` : ''}${gaugeRow(g)}
      <div class="acts">${e.applied ? `<a class="pb soft" href="#/event/${e.id}?apply=1">신청 수정</a>` : g.full ? '' : `<a class="pb" href="#/event/${e.id}?apply=1">참여 신청</a>`}
      <a class="lk" href="#/event/${e.id}">자세히 보기</a></div></article>`;
  }).join('')}${done.map(e => `<a class="evdone" href="#/event/${e.id}"><span class="grow" style="flex:1">${esc(e.title)}</span><span style="font-size:13px">마감됨</span>${chev}</a>`).join('')}</div>`;
}

let lobbyRoom = null, lobbyStart = null, bnSlide = 0;
function bannerHtml(b) {
  const g = b.event, ev = b.type === 'event';
  const label = ev ? `행사 · ${g.closed ? '마감' : g.full ? '정원 마감' : '모집 중'}` : (b.kind === 'dept' ? '학과 공지' : '행사 공지');
  const sub = ev ? [koWhen(b.starts_at), `${md2(g.deadline)} 마감`].filter(Boolean).join(' · ') : b.summary;
  const chip = (b.chips || [])[0];
  const more = ev ? `#/event/${b.id}` : `#/notice/${b.id}`;
  const pb = chip ? (chip.type === 'url' ? `<a class="pb" href="${esc(chip.target)}" target="_blank" rel="noopener noreferrer">${esc(chip.label)}</a>` : `<a class="pb" href="${esc(chipHref(chip))}">${esc(chip.label)}</a>`) : '';
  return `<article><span class="kicker">${label}</span><h2>${esc(b.title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}
    <div class="go">${pb}<a href="${more}">자세히 보기${chev}</a></div></article>`;
}
on(/^\/$/, async () => {

      <section class="card lock"><h3>로그인하면 더 쓸 수 있어요</h3><p class="muted" style="margin:0">세미나실 예약, 물품 대여, 행사 신청은 로그인한 뒤에 쓸 수 있습니다.</p>

  $('#next').onclick = () => { lobbyStart = addDays(lobbyStart, 7); route(); };
  $('#today').onclick = () => { lobbyStart = null; route(); };
  $('#tt').onclick = e => {

    location.hash = `#/reserve?room=${lobbyRoom}&date=${td.dataset.date}&hour=${td.dataset.hour}`;

function weekGrid(w) {
  const days = [...Array(7)].map((_, i) => addDays(w.start, i));
  const today = w.now.slice(0, 10), nowH = +w.now.slice(11, 13), map = {};
  let lo = 9, hi = 21;                                // 보통 9~21시, 그 밖의 예약이 있으면 넓힌다
  w.reservations.filter(r => r.room_id === lobbyRoom).forEach(r => { map[r.date + '|' + r.hour] = r; lo = Math.min(lo, r.hour); hi = Math.max(hi, r.hour); });
  let h = `<div class="wk" style="padding-bottom:10px"><span></span>${days.map((d, i) => `<div class="dh ${d === today ? 'today' : ''}">${DAYS[i]}<b>${+d.slice(8)}</b></div>`).join('')}</div><div style="display:flex;flex-direction:column;gap:3px">`;
  for (let hr = lo; hr <= hi; hr++) {
    h += `<div class="wk"><span class="hh">${hr}시</span>`;
    for (const d of days) {
      const r = map[d + '|' + hr], past = d < today || (d === today && hr < nowH), at = `data-date="${d}" data-hour="${hr}"`;
      h += r ? `<span class="c ${r.mine ? 'mine' : 'busy'}" ${at} data-who="${esc(r.mine ? '내 예약' : r.who)}">${r.mine ? '내 예약' : esc(r.who.split(' ')[0])}</span>`
        : past ? '<span></span>' : `<button ${at} aria-label="${+d.slice(5, 7)}월 ${+d.slice(8)}일 ${hr}시 예약"></button>`;
    }
    h += '</div>';
  }
  return h + '</div>';
}

on(/^\/reserve$/, async (m, q) => {
  const today = iso(new Date());
  let room = +q.get('room') || null, day = q.get('date') || today;
  const sel = new Set(q.get('hour') ? [+q.get('hour')] : []);
  async function draw() {
    const [w, my] = await Promise.all([api('week?start=' + day), api('my_reservations')]);
    room = room || w.rooms[0].id;
    const taken = {};
    w.reservations.filter(r => r.room_id === room && r.date === day).forEach(r => taken[r.hour] = r);
    const nowD = w.now.slice(0, 10), nowH = +w.now.slice(11, 13);
    $('#app').innerHTML = `<div class="cols"><section class="card"><h2>세미나실 예약</h2>
      <div class="seg">${w.rooms.map(r => `<button data-room="${r.id}" class="${r.id === room ? 'on' : ''}">${esc(r.name)}</button>`).join('')}</div>
      <label class="f">날짜<input type="date" id="day" value="${day}" min="${today}"></label>
      <p class="muted" style="margin:0 0 8px">시간을 눌러 고르세요 (1시간 단위, 여러 칸 가능)</p>
      <div class="slots">${[...Array(24)].map((_, h) => {
        const r = taken[h], past = day < nowD || (day === nowD && h < nowH);
        const cls = r ? (r.mine ? 'mine' : 'busy') : sel.has(h) ? 'sel' : '';
        return `<button class="slot ${cls}" data-h="${h}" ${r || past ? 'disabled' : ''}>${pad(h)}:00<small>${r ? esc(r.mine ? '내 예약' : r.who) : past ? '지남' : '~' + pad(h + 1) + ':00'}</small></button>`;
      }).join('')}</div>
      <button class="btn wide" id="go" style="margin-top:14px" ${sel.size ? '' : 'disabled'}>${sel.size ? `${sel.size}시간 예약하기` : '시간을 고르세요'}</button></section>
      <section class="card"><h3>내 예약</h3>${my.reservations.length ? `<div class="list">${my.reservations.map(r =>
        `<div><span class="grow">${esc(r.room)}<br><span class="muted">${r.date} ${pad(r.hour)}:00–${pad(r.hour + 1)}:00</span></span>
        <button class="btn red sm" data-cancel="${r.id}">취소</button></div>`).join('')}</div>` : '<p class="muted">예약이 없습니다.</p>'}</section></div>`;
    document.querySelectorAll('[data-room]').forEach(b => b.onclick = () => { room = +b.dataset.room; sel.clear(); draw(); });
    $('#day').onchange = e => { day = e.target.value || today; sel.clear(); draw(); };
    document.querySelectorAll('.slot').forEach(b => b.onclick = () => { const h = +b.dataset.h; sel.has(h) ? sel.delete(h) : sel.add(h); draw(); });
    document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
      if (!confirm('예약을 취소할까요?')) return;
      await api('unreserve', {id: +b.dataset.cancel}); toast('취소했습니다'); draw();
    });
    $('#go').onclick = async () => {
      await api('reserve', {room_id: room, date: day, hours: [...sel]});
      sel.clear(); toast('예약했습니다'); draw();
    };
  }
  await draw();
}, true);

        ${locked ? `<p class="muted" style="margin:0">${e.closed ? '신청이 마감됐어요.' + (app ? ' 신청한 내용은 위와 같아요.' : '') : '정원이 차서 더 이상 신청할 수 없어요.'}</p>` : '<button class="btn wide" id="sub"></button>'}</form></section></div>`;
  if (q.get('apply')) $('#applybox').scrollIntoView({behavior: 'smooth'});
  const f = $('#f'), sub = $('#sub');
  if (locked) { f.querySelectorAll('input,button').forEach(x => x.disabled = true); return; }
  const ok = () => e.fields.every((fd, i) => !fd.required || (fd.type === 'checkbox' ? vals[i] : String(vals[i]).trim()));
  const upd = () => { sub.disabled = !ok(); sub.textContent = ok() ? (app ? '신청 내용 수정' : '참여 신청') : '필수 항목을 채워 주세요'; };
  f.oninput = ev => { const i = ev.target.dataset.f; if (i == null) return; vals[i] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value; upd(); };
  f.onclick = ev => {
    const b = ev.target.closest('.opts button'); if (!b) return;
    const i = b.closest('fieldset').dataset.f;
    vals[i] = vals[i] === b.dataset.v ? '' : b.dataset.v;                    // 한 번 더 누르면 선택 해제
    b.closest('.opts').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === vals[i]));
    upd();
  };
  upd();
  f.onsubmit = async ev => {
    ev.preventDefault(); if (!ok()) return;
    await api('apply', {event_id: e.id, answers: vals});
    toast(app ? '수정했습니다' : '신청했습니다'); route();
  };
});

    <div class="f" style="font-size:13px;color:var(--muted);margin-bottom:6px">내용</div><div id="ed"></div>
    <label class="f" style="margin-top:16px">신청 현황을 같이 보여줄 행사 (없으면 비워 두세요)
      <select name="event_id"><option value="">없음</option>${evs.events.map(e => `<option value="${e.id}" ${n.event_id === e.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select></label>
    <label class="chk"><input type="checkbox" name="on_lobby" ${n.on_lobby ? 'checked' : ''}><span>로비 맨 위에 보이기<br><span class="muted">로그인하지 않은 사람도 이 글을 읽을 수 있게 됩니다</span></span></label>
    <h3 style="margin-top:16px">바로가기 버튼</h3>
    <p class="muted">글 아래에 붙는 버튼입니다. 예: 「세미나실 예약하기」를 누르면 예약 화면으로, 「MT 신청하기」를 누르면 그 행사의 신청서로 넘어갑니다. 6개까지 달 수 있어요.</p>
    <div id="chips">${chipRows()}</div>
    <button type="button" class="btn ghost wide" id="addc">+ 버튼 추가</button>
    <div class="row" style="margin-top:16px"><a class="btn line grow" href="#/admin/notices">취소</a><button class="btn grow">${isNew ? '올리기' : '저장'}</button></div></form></div>`;
  const ed = mdEditor($('#ed'), {value: n.body, draftKey: 'draft:notice:' + m[1], max: 20000});
  const hint = () => {
    $('#khint').textContent = kind === 'event' ? '행사 공지는 로그인하지 않은 사람도 읽을 수 있습니다.' : '학과 공지는 로그인한 사람만 읽을 수 있습니다. 아래에서 로비 맨 위에 보이기를 켜면 누구나 읽을 수 있어요.';
    document.querySelectorAll('#kseg button').forEach(b => b.classList.toggle('on', b.dataset.kind === kind));
  };
  hint();
  $('#kseg').onclick = ev => { const b = ev.target.closest('[data-kind]'); if (b) { kind = b.dataset.kind; hint(); } };
  const sync = () => document.querySelectorAll('#chips .fieldrow').forEach(r => {
    const c = chips[+r.dataset.i]; r.querySelectorAll('[data-k]').forEach(x => c[x.dataset.k] = x.value);
  });
  const first = {tab: 'reserve', event: String(evs.events[0]?.id ?? ''), notice: String(others[0]?.id ?? ''), url: ''};
  const redraw = () => { $('#chips').innerHTML = chipRows(); $('#addc').disabled = chips.length >= 6; };
  $('#chips').onchange = ev => {
    sync();
    if (ev.target.dataset.k === 'type') { const c = chips[+ev.target.closest('.fieldrow').dataset.i]; c.target = first[c.type]; redraw(); }
  };
  $('#chips').onclick = ev => { const b = ev.target.closest('[data-rm]'); if (b) { sync(); chips.splice(+b.dataset.rm, 1); redraw(); } };
  $('#addc').onclick = () => { sync(); chips.push({label: '', type: 'tab', target: 'reserve'}); redraw(); };
  redraw();
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); sync();
    const fd = new FormData(ev.target);
    await api('admin/notice_save', {id: isNew ? undefined : n.id, kind, title: fd.get('title'), summary: fd.get('summary'), body: ed.value,
      event_id: fd.get('event_id') || null, on_lobby: !!fd.get('on_lobby'), chips});
    ed.clearDraft(); toast(isNew ? '올렸습니다' : '저장했습니다'); location.hash = '#/admin/notices';
  };
}, true);

on(/^\/admin\/apps\/(\d+)$/, async m => {
  if (!isAdmin()) return location.hash = '#/';
  const d = await api('admin/applications?id=' + m[1]);
  const fs = d.event.fields;
  $('#app').innerHTML = `<div class="card"><div class="row"><h2 class="grow">${esc(d.event.title)} · 신청 ${d.applications.length}명</h2>
    <a class="btn line sm" href="#/admin/events">목록</a></div><div class="scroll-x"><table class="apps"><thead><tr><th>이름</th><th>학번</th><th>이메일</th>
    ${fs.map(f => `<th>${esc(f.label)}</th>`).join('')}<th>신청/수정</th></tr></thead><tbody>
    ${d.applications.map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.student_id)}</td><td>${esc(a.email)}</td>
      ${fs.map((f, i) => `<td>${f.type === 'checkbox' ? (a.answers[i] ? '예' : '') : esc(a.answers[i])}</td>`).join('')}<td class="muted">${fmt(a.updated_at)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}, true);

on(/^\/admin\/users$/, async () => {
  if (me?.role !== 'super') return location.hash = '#/';
  const d = await api('admin/users');
  $('#app').innerHTML = adminTabs() + `<div class="card"><h3>관리자 지정</h3><input class="in" id="qf" placeholder="이름·학번·아이디 검색">
    <div class="list" id="ul"></div></div>`;
  const draw = () => {
    const k = $('#qf').value.trim();
    $('#ul').innerHTML = d.users.filter(u => !k || [u.name, u.student_id, u.username].some(x => x.includes(k))).map(u => `<div>
      <span class="grow"><b>${esc(u.name)}</b> <span class="muted">${esc(u.student_id)} · ${esc(u.username)}</span></span>
      ${u.role === 'super' ? '<span class="pill mine">최고 관리자</span>'
        : `<button class="btn sm ${u.role === 'admin' ? 'red' : 'ghost'}" data-u="${u.id}" data-r="${u.role === 'admin' ? 'user' : 'admin'}">${u.role === 'admin' ? '관리자 해제' : '관리자로'}</button>`}</div>`).join('');
  };
  $('#qf').oninput = draw; draw();
  $('#ul').onclick = async e => {
    const b = e.target.closest('[data-u]'); if (!b) return;
    await api('admin/role', {id: +b.dataset.u, role: b.dataset.r});
    d.users.find(u => u.id === +b.dataset.u).role = b.dataset.r; draw();
  };
}, true);

api('me').then(d => { me = d.user; route(); });
</script>
</body>
</html>
