<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%221.5%22 y=%221.5%22 width=%2229%22 height=%2229%22 rx=%227%22 fill=%22%23FFFEFC%22 stroke=%22%2316181B%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2216%22 cy=%2211%22 r=%223.2%22 fill=%22%231E6B53%22/%3E%3Ccircle cx=%2216%22 cy=%2221%22 r=%223.2%22 fill=%22%232F5A93%22/%3E%3C/svg%3E">
<title>SWITCH · 반도체융합공학과 학생회</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F4F0;--sheet:#FFFEFC;--ink:#16181B;--sub:#3D4148;--muted:#8A8D93;
  --line:rgba(22,24,27,.08);--line2:rgba(22,24,27,.16);--glass:rgba(245,244,240,.82);
  --green:#1E6B53;--green-t:rgba(30,107,83,.08);--blue:#2F5A93;--blue-t:rgba(47,90,147,.09);
  --red:#B4473A;--on:#FFFEFC;
  --serif:"Iowan Old Style",Charter,"Palatino Linotype",Georgia,"Apple SD Gothic Neo",serif;
  --safe-b:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{
  --bg:#141516;--sheet:#1C1D1F;--ink:#ECEDEE;--sub:#C6C8CC;--muted:#878A90;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--glass:rgba(20,21,22,.8);
  --green:#63BC97;--green-t:rgba(99,188,151,.12);--blue:#86A9DE;--blue-t:rgba(134,169,222,.13);
  --red:#E07F72;--on:#141516}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;background:var(--glass);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.mark{font-family:var(--serif);font-size:24px;letter-spacing:.2px;text-decoration:none;color:var(--ink);line-height:1;white-space:nowrap}
header small{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.3px}
header .who{margin-left:auto;font-size:13px;text-align:right;color:var(--sub);line-height:1.4}
header .who a{color:var(--muted);text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:20px 16px calc(100px + var(--safe-b))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 8px;font-size:11px;color:var(--muted);text-decoration:none;min-height:56px}
nav a.on{color:var(--ink)}nav a.on svg{stroke-width:1.9}
h2{font-size:20px;font-weight:600;margin:4px 0 12px;letter-spacing:-.2px}h3{font-size:15px;font-weight:600;margin:0 0 10px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;
  border:1px solid transparent;border-radius:11px;background:var(--green);color:var(--on);font-weight:600;cursor:pointer;text-decoration:none}
.btn.blue{background:var(--ink);color:var(--bg)}
.btn.ghost,.btn.line{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn.red{background:transparent;border-color:var(--line2);color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px;white-space:nowrap;flex:none}
.btn.sm svg.i{width:16px;height:16px}
.btn.wide{width:100%}.btn:disabled{opacity:.35}
label.f{display:block;margin-bottom:14px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.in{display:block;width:100%;margin-top:6px;min-height:46px;padding:10px 12px;
  border:1px solid var(--line2);border-radius:11px;background:var(--sheet);color:var(--ink);font-size:16px;outline:none}
label.f input:focus,label.f select:focus,label.f textarea:focus,.in:focus{border-color:var(--green)}
textarea{min-height:96px!important;resize:vertical}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex:none;margin:0}
.req{color:var(--red);font-weight:400}
.seg{display:flex;border:1px solid var(--line2);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:14px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;gap:10px}.row>.grow{flex:1;min-width:0}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--green)}.pill.mine{color:var(--blue)}.pill.use,.pill.closed{color:var(--muted)}
.list>div{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
.note{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
/* 주간 타임테이블 — 폰 390px 에서 가로 스크롤 없이 7일이 들어간다 */
.tt-wrap{max-height:62vh;overflow:auto;border-radius:11px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table.tt{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:11px}
.tt th,.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:34px;padding:0 2px;text-align:center}
.tt th:last-child,.tt td:last-child{border-right:0}
.tt thead th{position:sticky;top:0;background:var(--sheet);color:var(--muted);z-index:2;height:46px;font-weight:400;line-height:1.25;border-bottom-color:var(--line2)}
.tt thead th b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.tt thead th.today,.tt thead th.today b{color:var(--green)}
.tt th.h{position:sticky;left:0;background:var(--sheet);color:var(--muted);width:38px;z-index:1;font-weight:400;font-size:10px}
.tt thead th.h{z-index:3}
.tt td{background:var(--sheet);padding:0 1px;letter-spacing:-.3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.tt td.past{background:var(--bg)}
.tt td.busy{background:var(--green-t);color:var(--green);font-weight:500}
.tt td.busy.mine{background:var(--blue-t);color:var(--blue)}
.tt td.nowrow{box-shadow:inset 0 1.5px 0 var(--green)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:54px;border-radius:11px;border:1px solid var(--line2);background:var(--sheet);font-size:14px;line-height:1.25;padding:4px;cursor:pointer}
.slot small{display:block;font-size:11px;color:var(--muted)}
.slot.sel{border-color:var(--green);background:var(--green-t);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.slot.sel small{color:var(--green)}
.slot.busy{background:var(--bg);border-color:var(--line);color:var(--muted)}
.slot.mine{background:var(--blue-t);border-color:var(--blue);color:var(--blue)}.slot.mine small{color:var(--blue)}
.slot:disabled{cursor:default}.slot:disabled:not(.busy):not(.mine){opacity:.35}
.result{text-align:center;padding:44px 20px 36px}
.result .big{display:inline-flex;width:76px;height:76px;border-radius:50%;border:1.5px solid currentColor;align-items:center;justify-content:center}
.result .big svg.i{width:34px;height:34px;stroke-width:1.5}
.result h2{font-size:22px;margin:18px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:11px;font-size:14px;z-index:9;max-width:90vw}
.fieldrow{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
.cols{display:grid;gap:14px}
@media (min-width:820px){
  main{padding-top:28px}.cols{grid-template-columns:1.6fr 1fr}.cols.even{grid-template-columns:1fr 1fr}
  .slots{grid-template-columns:repeat(6,1fr)}.tt{font-size:12px}.tt-wrap{max-height:70vh}
}
.authbox{max-width:400px;margin:28px auto}
.authbox .brand{text-align:center;margin-bottom:22px}.authbox .mark{display:block;font-size:44px;margin-bottom:8px}
table.apps{width:100%;border-collapse:collapse;font-size:13px}table.apps td,table.apps th{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}
table.apps th{color:var(--muted);font-weight:500}
.scroll-x{overflow-x:auto}
</style>
</head>
<body>
<header>
  <div><a class="mark" href="#/">SWITCH</a><small>반도체융합공학과 학생회</small></div>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null;
const isAdmin = () => me && (me.role === 'admin' || me.role === 'super');
const DAYS = ['월','화','수','목','금','토','일'];
// 테두리만 있는 단색 아이콘 — stroke 가 글자색을 따른다
const ICON = {
  home: '<path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/>',
  box: '<path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  flag: '<path d="M5.5 21V4M5.5 4.5h11l-2.2 4 2.2 4h-11"/>',
  gear: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  back: '<path d="M9 6.5 4.5 11 9 15.5"/><path d="M5 11h9.5a5 5 0 0 1 0 10H12"/>',
  stop: '<circle cx="12" cy="12" r="7.5"/><path d="m6.8 17.2 10.4-10.4"/>',
  alert: '<path d="M12 6.5v7M12 17v.5"/>',
  qr: '<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M13.5 13.5h3v3h-3zM20.5 13.5v.01M17 20.5h3.5V17"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
};
const icon = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return iso(d); };
const fmt = s => s ? s.replace('T', ' ') : '';

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}

async function api(path, body) {
  const r = await fetch('api/' + path, body === undefined ? {} :
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({error: '서버 응답 오류'}));
  if (r.status === 401 && path !== 'login') { me = null; goLogin(); throw new Error(d.error); }
  if (!r.ok) { toast(d.error || '오류'); throw new Error(d.error); }
  return d;
}
function goLogin() { location.hash = '#/login?next=' + encodeURIComponent(location.hash || '#/'); }

function renderChrome(route) {
  $('#who').innerHTML = me
    ? `${esc(me.name)}<br><a href="#/logout">로그아웃</a>`
    : `<a href="#/login">로그인</a>`;
  const tabs = [['#/','home','로비'],['#/items','box','대여'],['#/reserve','cal','예약'],['#/events','flag','행사']];
  if (isAdmin()) tabs.push(['#/admin','gear','관리']);
  $('#nav').innerHTML = tabs.map(([h,i,t]) =>
    `<a href="${h}" class="${(route === h.slice(1) || (h !== '#/' && route.startsWith(h.slice(1)))) ? 'on' : ''}">${icon(i)}${t}</a>`).join('');
}

// ── 라우터 ────────────────────────────────────────────────────────────
const routes = [];
const on = (re, fn, needLogin) => routes.push({re, fn, needLogin});
async function route() {
  const hash = location.hash.slice(1) || '/';
  const [path, qs] = hash.split('?');
  const q = new URLSearchParams(qs || '');
  renderChrome(path);
  for (const r of routes) {
    const m = path.match(r.re);
    if (!m) continue;
    if (r.needLogin && !me) return goLogin();
    window.scrollTo(0, 0);
    try { await r.fn(m, q); } catch (e) { console.error(e); }
    return;
  }
  location.hash = '#/';
}
addEventListener('hashchange', route);

// ── 로그인 / 가입 ─────────────────────────────────────────────────────
on(/^\/login$/, (m, q) => {
  const next = q.get('next') || '#/';
  $('#app').innerHTML = `<div class="authbox"><div class="brand"><a class="mark" href="#/">SWITCH</a><span class="muted">반도체융합공학과 학생회</span></div><div class="card">
    <h2>로그인</h2>
    <form id="f"><label class="f">아이디<input name="username" autocomplete="username" autocapitalize="off" required></label>
    <label class="f">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn wide">로그인</button></form>
    <p class="muted" style="text-align:center">처음이신가요? <a href="#/signup?next=${encodeURIComponent(next)}">회원가입</a> · <a href="#/forgot">아이디·비밀번호 찾기</a></p></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('login', Object.fromEntries(new FormData(e.target)));
    me = d.user; location.hash = next;
  };
});
on(/^\/signup$/, (m, q) => {
  const next = q.get('next') || '#/';
  $('#app').innerHTML = `<div class="authbox"><div class="card"><h2>회원가입</h2><form id="f">
    <label class="f">아이디 (영문·숫자)<input name="username" autocomplete="username" autocapitalize="off" required minlength="3"></label>
    <label class="f">이름<input name="name" autocomplete="name" required></label>
    <label class="f">학번<input name="student_id" inputmode="numeric" autocomplete="off" required></label>
    <label class="f">이메일<input name="email" type="email" autocomplete="email" required></label>
    <!-- 비밀번호는 맨 끝 — 중간에 두면 iOS 자동완성이 다음 칸(이름)에도 비밀번호를 채운다 -->
    <label class="f">비밀번호 (6자 이상)<input name="password" type="password" autocomplete="new-password" required minlength="6"></label>
    <button class="btn wide">가입하고 시작하기</button></form>
    <p class="muted" style="text-align:center"><a href="#/login?next=${encodeURIComponent(next)}">이미 계정이 있어요</a></p></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('signup', Object.fromEntries(new FormData(e.target)));
    me = d.user; location.hash = next;
  };
});
on(/^\/forgot$/, () => {
  $('#app').innerHTML = `<div class="authbox"><div class="card"><h2>아이디·비밀번호 찾기</h2>
    <p class="muted">가입할 때 쓴 이메일로 아이디와 비밀번호 재설정 링크를 보내 드립니다.</p>
    <form id="f"><label class="f">이메일<input name="email" type="email" autocomplete="email" required></label>
    <button class="btn wide">메일 보내기</button></form>
    <p class="muted" style="text-align:center"><a href="#/login">로그인으로</a></p></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    await api('forgot', Object.fromEntries(new FormData(e.target)));
    $('#app').innerHTML = `<div class="card result"><div class="big" style="color:var(--green)">${icon('check')}</div>
      <h2>메일을 보냈습니다</h2><p class="muted">가입된 이메일이라면 곧 도착합니다. 안 보이면 스팸함도 확인해 주세요.</p>
      <a class="btn line" href="#/login">로그인으로</a></div>`;
  };
});
on(/^\/reset\/([\w-]+)$/, m => {
  history.replaceState(null, '', '#/reset');   // 링크 토큰을 주소창·방문기록에 남기지 않는다
  $('#app').innerHTML = `<div class="authbox"><div class="card"><h2>새 비밀번호</h2><form id="f">
    <label class="f">새 비밀번호 (6자 이상)<input name="password" type="password" autocomplete="new-password" required minlength="6"></label>
    <button class="btn wide">바꾸고 로그인</button></form></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('reset', {token: m[1], ...Object.fromEntries(new FormData(e.target))});
    me = d.user; toast('비밀번호를 바꿨습니다'); location.hash = '#/';
  };
});
on(/^\/logout$/, async () => { await api('logout', {}); me = null; location.hash = '#/'; });

// ── QR 스캔 결과 ──────────────────────────────────────────────────────
on(/^\/q\/([a-z0-9]+)$/, async m => {
  $('#app').innerHTML = `<div class="card result"><p class="muted">처리 중…</p></div>`;
  let d;
  // 새로고침·탭 복원으로 같은 주소가 다시 열리면 반납돼 버린다 — 주소에서 QR 코드를 지운다
  history.replaceState(null, '', '#/');
  try { d = await api('scan', {code: m[1]}); }
  catch (e) { $('#app').innerHTML = `<div class="card result"><div class="big" style="color:var(--red)">${icon('alert')}</div><h2>${esc(e.message)}</h2><p></p><a class="btn line" href="#/">로비로</a></div>`; return; }
  const v = {borrowed: ['check', '대여 완료', '다 쓰면 같은 QR 을 다시 찍으면 반납됩니다.', 'var(--green)'],
             returned: ['back', '반납 완료', '이용해 주셔서 감사합니다.', 'var(--blue)'],
             in_use:   ['stop', '사용중인 상품입니다', '다른 사람이 대여 중이에요.', 'var(--muted)']}[d.result];
  $('#app').innerHTML = `<div class="card result"><div class="big" style="color:${v[3]}">${icon(v[0])}</div>
    <h2>${v[1]}</h2><p><b>${esc(d.item)}</b></p><p class="muted">${v[2]}</p>
    <a class="btn line" href="#/items">내 대여 보기</a></div>`;
}, true);

// ── 로비 ──────────────────────────────────────────────────────────────
let lobbyRoom = null, lobbyStart = null;
on(/^\/$/, async () => {
  const [w, ev] = await Promise.all([api('week' + (lobbyStart ? '?start=' + lobbyStart : '')), api('events')]);
  lobbyStart = w.start; lobbyRoom = lobbyRoom || w.rooms[0].id;
  const events = ev.events.filter(e => !e.closed).concat(ev.events.filter(e => e.closed)).slice(0, 6);
  $('#app').innerHTML = `<div class="cols">
    <section class="card"><div class="row" style="margin-bottom:10px"><h3 class="grow" style="margin:0">세미나실 이번 주</h3>

    if (td.dataset.who) return toast(`${td.dataset.date} ${td.dataset.hour}:00 · ${td.dataset.who}`);
    if (!td.classList.contains('past')) location.hash = `#/reserve?room=${lobbyRoom}&date=${td.dataset.date}&hour=${td.dataset.hour}`;
  };
  const nowH = new Date(w.now).getHours();
  const row = $('#tt').querySelector(`tr[data-h="${Math.max(0, (w.start <= w.now.slice(0,10) && w.now.slice(0,10) <= addDays(w.start, 6) ? nowH : 9) - 1)}"]`);
  if (row) $('#tt').scrollTop = row.offsetTop - 42;
});

function timetable(w) {
  const days = [...Array(7)].map((_, i) => addDays(w.start, i));
  const today = w.now.slice(0, 10), nowH = +w.now.slice(11, 13);
  const map = {};
  w.reservations.filter(r => r.room_id === lobbyRoom).forEach(r => map[r.date + '|' + r.hour] = r);
  let h = `<table class="tt"><thead><tr><th class="h"></th>${days.map((d, i) =>
    `<th class="${d === today ? 'today' : ''}">${DAYS[i]}<b>${+d.slice(8)}</b></th>`).join('')}</tr></thead><tbody>`;
  for (let hr = 0; hr < 24; hr++) {
    h += `<tr data-h="${hr}"><th class="h">${hr}시</th>`;
    for (const d of days) {
      const r = map[d + '|' + hr];
      const past = d < today || (d === today && hr < nowH);
      const cls = [r ? 'busy' : '', r && r.mine ? 'mine' : '', past ? 'past' : '', d === today && hr === nowH ? 'nowrow' : ''].join(' ');
      h += `<td class="${cls}" data-date="${d}" data-hour="${hr}" ${r ? `data-who="${esc(r.who)}"` : ''}>${r ? esc(r.who.split(' ')[0]) : ''}</td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

function eventCard(e) {
  const tag = e.closed ? '<span class="pill closed">마감</span>' : e.applied ? '<span class="pill mine">신청함</span>' : '<span class="pill ok">모집 중</span>';
  return `<div class="card"><div class="row"><h3 class="grow" style="margin:0">${esc(e.title)}</h3>${tag}</div>
    ${e.starts_at ? `<p class="muted" style="margin:6px 0 0">일시 ${fmt(e.starts_at)}</p>` : ''}
    <p class="muted" style="margin:2px 0 12px">마감 ${fmt(e.deadline)}</p>
    <div class="row"><a class="btn line sm grow" href="#/event/${e.id}">자세히 보기</a>
    ${e.closed ? '' : `<a class="btn sm grow" href="#/event/${e.id}?apply=1">${e.applied ? '신청 수정' : '참여 신청'}</a>`}</div></div>`;
}

on(/^\/reserve$/, async (m, q) => {
  const today = iso(new Date());
  let room = +q.get('room') || null, day = q.get('date') || today;
  const sel = new Set(q.get('hour') ? [+q.get('hour')] : []);
  async function draw() {
    const [w, my] = await Promise.all([api('week?start=' + day), api('my_reservations')]);
    room = room || w.rooms[0].id;
    const taken = {};
    w.reservations.filter(r => r.room_id === room && r.date === day).forEach(r => taken[r.hour] = r);
    const nowD = w.now.slice(0, 10), nowH = +w.now.slice(11, 13);
    $('#app').innerHTML = `<div class="cols"><section class="card"><h2>세미나실 예약</h2>
      <div class="seg">${w.rooms.map(r => `<button data-room="${r.id}" class="${r.id === room ? 'on' : ''}">${esc(r.name)}</button>`).join('')}</div>
      <label class="f">날짜<input type="date" id="day" value="${day}" min="${today}"></label>
      <p class="muted" style="margin:0 0 8px">시간을 눌러 고르세요 (1시간 단위, 여러 칸 가능)</p>
      <div class="slots">${[...Array(24)].map((_, h) => {
        const r = taken[h], past = day < nowD || (day === nowD && h < nowH);
        const cls = r ? (r.mine ? 'mine' : 'busy') : sel.has(h) ? 'sel' : '';
        return `<button class="slot ${cls}" data-h="${h}" ${r || past ? 'disabled' : ''}>${pad(h)}:00<small>${r ? esc(r.mine ? '내 예약' : r.who) : past ? '지남' : '~' + pad(h + 1) + ':00'}</small></button>`;
      }).join('')}</div>
      <button class="btn wide" id="go" style="margin-top:14px" ${sel.size ? '' : 'disabled'}>${sel.size ? `${sel.size}시간 예약하기` : '시간을 고르세요'}</button></section>
      <section class="card"><h3>내 예약</h3>${my.reservations.length ? `<div class="list">${my.reservations.map(r =>
        `<div><span class="grow">${esc(r.room)}<br><span class="muted">${r.date} ${pad(r.hour)}:00–${pad(r.hour + 1)}:00</span></span>
        <button class="btn red sm" data-cancel="${r.id}">취소</button></div>`).join('')}</div>` : '<p class="muted">예약이 없습니다.</p>'}</section></div>`;
    document.querySelectorAll('[data-room]').forEach(b => b.onclick = () => { room = +b.dataset.room; sel.clear(); draw(); });
    $('#day').onchange = e => { day = e.target.value || today; sel.clear(); draw(); };
    document.querySelectorAll('.slot').forEach(b => b.onclick = () => { const h = +b.dataset.h; sel.has(h) ? sel.delete(h) : sel.add(h); draw(); });
    document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
      if (!confirm('예약을 취소할까요?')) return;
      await api('unreserve', {id: +b.dataset.cancel}); toast('취소했습니다'); draw();
    });
    $('#go').onclick = async () => {
      await api('reserve', {room_id: room, date: day, hours: [...sel]});
      sel.clear(); toast('예약했습니다'); draw();
    };
  }
  await draw();
}, true);

on(/^\/admin\/users$/, async () => {
  if (me?.role !== 'super') return location.hash = '#/';
  const d = await api('admin/users');
  $('#app').innerHTML = adminTabs() + `<div class="card"><h3>관리자 지정</h3><input class="in" id="qf" placeholder="이름·학번·아이디 검색">
    <div class="list" id="ul"></div></div>`;
  const draw = () => {
    const k = $('#qf').value.trim();
    $('#ul').innerHTML = d.users.filter(u => !k || [u.name, u.student_id, u.username].some(x => x.includes(k))).map(u => `<div>
      <span class="grow"><b>${esc(u.name)}</b> <span class="muted">${esc(u.student_id)} · ${esc(u.username)}</span></span>
      ${u.role === 'super' ? '<span class="pill mine">최고 관리자</span>'
        : `<button class="btn sm ${u.role === 'admin' ? 'red' : 'ghost'}" data-u="${u.id}" data-r="${u.role === 'admin' ? 'user' : 'admin'}">${u.role === 'admin' ? '관리자 해제' : '관리자로'}</button>`}</div>`).join('');
  };
  $('#qf').oninput = draw; draw();
  $('#ul').onclick = async e => {
    const b = e.target.closest('[data-u]'); if (!b) return;
    await api('admin/role', {id: +b.dataset.u, role: b.dataset.r});
    d.users.find(u => u.id === +b.dataset.u).role = b.dataset.r; draw();
  };
}, true);

api('me').then(d => { me = d.user; route(); });
</script>
</body>
</html>
