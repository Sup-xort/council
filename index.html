<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 사이트에 어두운 화면이 있다고 브라우저에 알린다. 없으면 삼성 인터넷 등이 제멋대로 색을 뒤집는다 -->
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141211" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%221.5%22 y=%221.5%22 width=%2229%22 height=%2229%22 rx=%227%22 fill=%22%23FFFFFF%22 stroke=%22%235B4545%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2216%22 cy=%2211%22 r=%223.4%22 fill=%22%2398BE78%22/%3E%3Ccircle cx=%2216%22 cy=%2221%22 r=%223.4%22 fill=%22%237FB8D6%22/%3E%3C/svg%3E">
<title>SWITCH · 반도체융합공학과 학생회</title>
<style>
/* 색: 선본색 갈색 #5B4545 = 글자·주 버튼, 연두 #CCE3B8 = 가능·선택, 하늘 #C4E4F4 = 내 것. 남의 것은 회색. */
:root{color-scheme:light dark;
  --bg:#F6F7F3;--card:#FFFFFF;--fill:#EFF1EC;--ink:#3A2C2C;--sub:#6B6060;
  --brand:#5B4545;--on-brand:#FFFFFF;
  --ok:#CCE3B8;--ok-ink:#3A2C2C;--ok-soft:#E6F0DC;
  --mine:#C4E4F4;--mine-ink:#3A2C2C;
  --busy:#E5E1E0;--busy-ink:#5B4545;
  --line:rgba(91,69,69,.12);--tint:rgba(91,69,69,.07);--track:rgba(91,69,69,.1);--dot:rgba(91,69,69,.25);
  --req:#B3261E;--seg-on:#FFFFFF;--bn-bg:#5B4545;--bn-ink:#FFFFFF;--bn-sub:#EADFDD;--art-bg:#F4EFE8;--art-ink:#5B4545;--sand:#E6D5CF;--safe-b:env(safe-area-inset-bottom)}
/* 어두운 색: 기기 설정이 어두움이면 자동으로, 또는 화면 밝기를 '어둡게'로 골랐을 때 */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141211;--card:#1F1B1A;--fill:#2A2524;--ink:#F2ECEA;--sub:#ABA19F;
  --brand:#EADFDD;--on-brand:#1F1B1A;
  --ok:#3E5A33;--ok-ink:#F2ECEA;--ok-soft:#2A3823;
  --mine:#2B5265;--mine-ink:#F2ECEA;
  --busy:#38322F;--busy-ink:#E0D6D4;
  --line:rgba(255,255,255,.09);--tint:rgba(255,255,255,.08);--track:rgba(255,255,255,.12);--dot:rgba(255,255,255,.3);
  --req:#F2B8B5;--seg-on:#3A3331;--bn-bg:#4A3838;--bn-ink:#FFFFFF;--bn-sub:#E6DAD8;--art-bg:#2B2422;--art-ink:#F2ECEA;--sand:#5A4A46}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#141211;--card:#1F1B1A;--fill:#2A2524;--ink:#F2ECEA;--sub:#ABA19F;
  --brand:#EADFDD;--on-brand:#1F1B1A;
  --ok:#3E5A33;--ok-ink:#F2ECEA;--ok-soft:#2A3823;
  --mine:#2B5265;--mine-ink:#F2ECEA;
  --busy:#38322F;--busy-ink:#E0D6D4;
  --line:rgba(255,255,255,.09);--tint:rgba(255,255,255,.08);--track:rgba(255,255,255,.12);--dot:rgba(255,255,255,.3);
  --req:#F2B8B5;--seg-on:#3A3331;--bn-bg:#4A3838;--bn-ink:#FFFFFF;--bn-sub:#E6DAD8;--art-bg:#2B2422;--art-ink:#F2ECEA;--sand:#5A4A46}
:root[data-theme=light]{color-scheme:light}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;min-height:0!important;border:0;border-radius:50%;background:var(--tint);color:var(--ink);padding:0;cursor:pointer;flex:none}
.themebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.47 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 머리줄 + 메뉴: 폰은 머리줄 아래 글자 탭 한 줄, 넓은 화면은 머리줄 안. 브라우저 하단 툴바와 겹치지 않게 위에만 둔다 */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .bar{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;column-gap:16px;padding:0 16px}
header .mark{height:48px;display:flex;align-items:center;font-size:18px;font-weight:700;letter-spacing:.2px;text-decoration:none;color:var(--brand)}
header .who{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--sub)}
header .who a,header .who .themebtn{min-height:44px;display:flex;align-items:center;text-decoration:none}
header .who a.adm{color:var(--brand);font-weight:600}
nav#nav{order:3;flex:1 0 100%;display:flex;margin:0 -8px;overflow-x:auto;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
nav#nav a{flex:1 0 auto;min-height:44px;padding:0 12px;display:flex;align-items:center;justify-content:center;position:relative;
  font-size:15px;color:var(--sub);text-decoration:none;white-space:nowrap}
nav#nav a.on{color:var(--ink);font-weight:600}
nav#nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2.5px;border-radius:2px;background:var(--brand)}
@media (min-width:820px){
  header .bar{flex-wrap:nowrap;height:60px}
  nav#nav{order:0;flex:0 1 auto;margin:0 0 0 16px}
  nav#nav a{flex:none;min-height:60px;padding:0 14px}
}
body.bare header{display:none}
main{max-width:1100px;margin:0 auto;padding:12px 12px calc(32px + var(--safe-b))}
@media (min-width:820px){main{padding-top:24px}}

h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.25;text-wrap:balance}
h2{font-size:26px;font-weight:700;letter-spacing:-.7px;line-height:1.2;margin:8px 4px 16px}
h3{font-size:19px;font-weight:600;letter-spacing:-.4px;margin:0 0 8px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:0 0 16px}.col>.card,.cols>.card,.cols>section{margin:0}.card.tight{padding:16px 8px}
.muted{color:var(--sub);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:0;border-radius:99px;
  background:var(--brand);color:var(--on-brand);font-weight:500;font-size:16px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.line{background:var(--tint);color:var(--ink)}
.btn.red{background:var(--tint);color:var(--req)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;flex:none}
.btn.wide{width:100%;min-height:52px;font-size:17px}.btn:disabled{background:var(--tint);color:var(--sub);cursor:default}
label.f{display:block;margin-bottom:16px;font-size:13px;color:var(--sub)}
label.f input,.in{display:block;width:100%;margin-top:8px;min-height:48px;padding:8px 16px;
  border:0;border-radius:12px;background:var(--fill);color:var(--ink);font-size:16px;outline:none}
label.f input:focus,.in:focus{box-shadow:0 0 0 2px var(--brand)}
label.chk{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:0}
.req{color:var(--req);font-weight:400}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--tint);margin-bottom:16px}
.seg button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:38px;padding:0 8px;border:0;border-radius:9px;background:none;color:var(--sub);font-size:14px;cursor:pointer}
.seg button.on{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;align-items:center;gap:8px}.row>.grow,.grow{flex:1;min-width:0}
.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:13px;font-weight:500;background:var(--tint);color:var(--ink);white-space:nowrap}
.pill.mine{background:var(--mine);color:var(--mine-ink)}
.list>div{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
.cols{display:grid;gap:16px}
@media (min-width:820px){.cols{grid-template-columns:1.6fr 1fr}}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);
  padding:8px 16px;border-radius:99px;font-size:14px;z-index:9;max-width:90vw}
.kicker{font-size:13px;color:var(--sub);white-space:nowrap}
.big-title{margin:0;font-size:30px;font-weight:700;letter-spacing:-.9px;line-height:1.15}
.head{display:flex;flex-direction:column;gap:8px;padding:8px 4px 0;margin-bottom:8px}
.head .meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--sub)}
.head .meta .pill{background:var(--card);color:var(--ink)}.head .meta .pill.mine{background:var(--mine);color:var(--mine-ink)}
.rows{background:var(--card);border-radius:18px;padding:8px 16px;margin-bottom:16px}
.rows>div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows>div:last-child{border:0}.rows>div>span:first-child{color:var(--sub)}
.rb{width:44px;height:44px;border:0;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.rb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.txt{width:auto;padding:0 16px;border-radius:99px;font-size:14px;white-space:nowrap}
.pb{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:99px;background:var(--brand);color:var(--on-brand);font-size:14px;text-decoration:none;border:0;white-space:nowrap}
.pb.soft{background:var(--tint);color:var(--ink)}
.lk{min-height:44px;display:inline-flex;align-items:center;gap:4px;font-size:14px;text-decoration:none;white-space:nowrap}

/* 로비: 폰은 배너 → 행사 → 세미나실, 넓은 화면은 세미나실과 행사를 나란히 */
.lobby{display:grid;gap:16px;grid-template-areas:"bn" "ev" "room"}
.lobby>.bn{grid-area:bn;min-width:0}.lobby>.ev-sec{grid-area:ev;min-width:0}.lobby>.room{grid-area:room;min-width:0}
@media (min-width:1000px){.lobby{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"bn bn" "room ev";align-items:start}}
/* 배너: 왼쪽 글, 오른쪽 그림 자리. 그림은 사이트가 만든다 — 행사는 날짜를 크게, 공지는 선본색 도형을 글마다 다르게 배치 */
.banner{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);min-height:248px;border-radius:24px;background:var(--bn-bg);color:var(--bn-ink);overflow:hidden;touch-action:pan-y}
.banner article{display:flex;flex-direction:column;gap:10px;padding:32px 24px 26px 36px;min-width:0}
.banner .kicker{align-self:flex-start;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14);color:var(--bn-ink);font-size:12px;font-weight:600}
.banner h2{margin:4px 0 0;font-size:32px;letter-spacing:-.9px;line-height:1.2;color:var(--bn-ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.banner p{margin:0;font-size:15px;line-height:1.5;color:var(--bn-sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.banner .go{margin-top:auto;display:flex;align-items:center;gap:16px;padding-top:14px}
.banner .go a{min-height:44px;display:flex;align-items:center;gap:4px;font-size:15px;text-decoration:none;color:var(--bn-ink)}
.banner .go a.pb{min-height:40px;padding:0 20px;font-size:14px;font-weight:600;background:var(--ok);color:var(--ok-ink)}
.banner .art{position:relative;margin:14px 14px 14px 0;border-radius:18px;background:var(--art-bg);overflow:hidden}
.banner .art svg{position:absolute;inset:0;width:100%;height:100%}
.banner .art .date{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--art-ink);text-align:center}
.banner .art .date small{font-size:14px;font-weight:600;letter-spacing:.2px}
.banner .art .date b{font-size:76px;line-height:1;font-weight:800;letter-spacing:-3px}
.banner .art .date em{margin-top:8px;font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--art-ink);color:var(--art-bg)}
.banner .dots{position:absolute;left:24px;bottom:4px}
.banner .dots i{background:rgba(255,255,255,.35)}.banner .dots .on i{background:#fff;width:18px;border-radius:99px}
@media (max-width:640px){
  .banner{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:0}
  .banner .art{order:-1;height:128px;margin:12px 12px 0}
  .banner .art .date{flex-direction:row;gap:10px}.banner .art .date b{font-size:56px;letter-spacing:-2px}
  .banner .art .date em{margin:0}
  .banner article{padding:16px 20px 30px}.banner h2{font-size:24px}
  .banner .dots{left:auto;right:12px}}
.dots{display:flex;justify-content:center}
.dots button{width:24px;height:36px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dot);transition:width .2s}.dots .on i{background:var(--brand)}
.sec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 8px}
.sec-head h2{margin:0;flex:1;min-width:0;font-size:24px}

/* 세미나실 시간표 (오늘부터 7일, 0~24시) */
.wk{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));gap:3px}
.wk .dh{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.wk .dh b{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:400;color:var(--ink)}
.wk .dh.today b{background:var(--brand);color:var(--on-brand);border-radius:50%;font-weight:600}
.wk .dh.sun{color:var(--req)}
.wk .hh{display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;color:var(--sub);white-space:nowrap}
.grid-rows{display:flex;flex-direction:column;gap:3px}
.wk button,.wk span.c,.wk span.p{height:26px;border:0;border-radius:6px;padding:0}
.wk button{background:var(--ok-soft);cursor:pointer}
.wk span.p{background:var(--fill);opacity:.45}
.wk span.c{display:block;cursor:pointer}.wk span.c.busy{background:var(--busy)}.wk span.c.mine{background:var(--mine)}
.tt{display:flex;flex-direction:column;gap:3px;user-select:none;-webkit-user-select:none}
.tt .tc{height:30px;border-radius:7px;background:var(--ok-soft);touch-action:none;cursor:pointer}
.tt .tc.busy{background:var(--busy);cursor:default;touch-action:pan-y}.tt .tc.mine{background:var(--mine);cursor:default;touch-action:pan-y}
.tt .tc.past{background:var(--fill);opacity:.45;cursor:default;touch-action:pan-y}
.tt .tc.sel{background:var(--ok);box-shadow:inset 0 0 0 2px var(--brand)}
.wkbar{display:flex;align-items:center;gap:8px;margin:12px 4px 8px}.wkbar b{flex:1;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.act[hidden]{display:none}.act{position:sticky;bottom:calc(12px + var(--safe-b));z-index:4;display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px 8px 8px 16px;border-radius:99px;background:var(--brand);color:var(--on-brand)}
.act span{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .btn{min-height:44px;background:var(--card);color:var(--ink);padding:0 16px}.act .btn:disabled{background:rgba(255,255,255,.18);color:inherit;opacity:.6}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 16px;padding-top:12px;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* 결과 화면 (QR) */
.result{text-align:center;padding:64px 24px 36px;background:none;margin:0}
.result .big{display:inline-flex;width:76px;height:76px;border-radius:50%;background:var(--ok);color:var(--ok-ink);align-items:center;justify-content:center}
.result .big.mute{background:var(--tint);color:var(--sub)}
.result .big svg.i{width:36px;height:36px;stroke-width:2}
.result h2{font-size:30px;margin:24px 0 0}.result .nm{margin:8px 0 0;font-size:19px;font-weight:500}
.result .muted{max-width:280px;margin:16px auto 0;font-size:15px;text-wrap:pretty}
.result .btn{margin-top:44px;width:100%;min-height:50px}
.authbox{max-width:400px;margin:24px auto}
.authbox .brand{text-align:center;margin-bottom:16px}
.authbox .brand .mark{display:block;font-size:44px;font-weight:700;letter-spacing:-1px;text-decoration:none;margin-bottom:4px;color:var(--brand)}
.authbox .home{display:inline-flex;min-height:44px;align-items:center;font-size:14px;color:var(--sub);text-decoration:none}

/* 행사 */
.ev{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ev h3{margin:0}.ev .when{font-size:14px;color:var(--sub)}
.ev .acts{display:flex;align-items:center;gap:16px;padding-top:8px}
.evdone{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 16px;color:var(--sub);text-decoration:none;border-top:1px solid var(--line)}
.evlist{border-radius:22px;background:var(--card);overflow:hidden}.evlist>.ev:last-child{border-bottom:0}
.g{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.g .t{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}.g .t b{color:var(--ink);font-weight:600}
.gauge{height:6px;border-radius:99px;background:var(--track);overflow:hidden}.gauge i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.gbig{display:flex;flex-direction:column;gap:8px}
.gbig .n{display:flex;align-items:baseline;gap:8px}.gbig .n b{font-size:30px;font-weight:700;letter-spacing:-.8px}.gbig .n span{font-size:15px;color:var(--sub)}.gbig .n em{margin-left:auto;font-style:normal;font-size:13px;color:var(--sub)}
.gbig .gauge{height:8px}
/* 정원 없는 행사: 연두 단색 막대 (끝을 정할 수 없으니 채움 정도는 없다) */
.gauge.open{background:var(--ok)}
/* 한 줄에 정보가 여럿이면 칩으로 나눠 보인다 */
.chipline{display:flex!important;flex-wrap:wrap;align-items:center;gap:4px;white-space:normal}
.kp{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--tint);color:var(--ink);font-size:12px;font-weight:500;white-space:nowrap}
.kp.ok{background:var(--ok);color:var(--ok-ink);font-weight:600}.kp.mine{background:var(--mine);color:var(--mine-ink);font-weight:600}
.kp.dim{color:var(--sub)}
.dday{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:700;letter-spacing:.2px;vertical-align:1px}
.dday.today{background:var(--req);color:#fff}
.banner .dday{background:var(--ok);color:var(--ok-ink)}
.apply{display:flex;flex-direction:column;gap:16px;padding:24px 16px}.apply h2{margin:0;font-size:22px;letter-spacing:-.5px}
.apply .who{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--fill)}
.apply .who b{font-size:16px;font-weight:500}.apply .who span{font-size:14px;color:var(--sub)}
.apply fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px}
.apply legend{padding:0 0 8px;font-size:15px;font-weight:500}
.apply label.t{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
.apply label.t input,.apply label.t select,.apply label.t textarea{height:48px;padding:0 16px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font-size:16px;font-weight:400;font-family:inherit;outline:none}
.apply label.t textarea{height:auto;min-height:104px;padding:12px 16px;resize:vertical;line-height:1.5}
.apply label.t input:focus,.apply label.t select:focus,.apply label.t textarea:focus{box-shadow:0 0 0 2px var(--brand)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{height:48px;border:0;border-radius:12px;background:var(--fill);font-size:15px;cursor:pointer}
.opts button[aria-pressed=true]{background:var(--ok);color:var(--ok-ink);font-weight:600;box-shadow:inset 0 0 0 2px var(--brand)}
.done{display:flex;align-items:center;gap:8px;padding:16px;border-radius:14px;background:var(--ok);color:var(--ok-ink);font-size:15px}
.apply .btn{min-height:52px;font-size:17px}

/* 공지 */
.nrow{display:block;text-decoration:none;background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.nrow h3,.ev h3{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nrow h3{margin:8px 0 0}
.pn{border-radius:18px;background:var(--card);overflow:hidden}
.pn a{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;min-height:56px;padding:0 16px;text-decoration:none}
.pn a+a{border-top:1px solid var(--line)}.pn small{font-size:13px;color:var(--sub)}.pn b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:99px;background:var(--tint);text-decoration:none;font-size:15px}
.linked{display:flex;flex-direction:column;gap:8px}.linked .pb{align-self:stretch;justify-content:center;min-height:48px;margin-top:8px;font-size:16px}
/* 공지 본문: 폰은 테두리 없이 폭을 넓게, 넓은 화면은 읽는 폭 640px 안팎에 여백 넉넉히 */
.reading{background:var(--card);border-radius:22px;padding:40px 48px;margin:0}
@media (max-width:600px){.reading{border-radius:18px;padding:20px 16px}.reading .md{font-size:17px;line-height:1.7}}

/* 대여 */
.mybar{padding:14px 16px 16px;border-radius:18px;background:var(--mine);color:var(--mine-ink)}
.mybar h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:16px}
.mybar h3 .kp{background:rgba(255,255,255,.7);color:var(--mine-ink)}
.myrows{display:flex;flex-direction:column;gap:6px}
.myrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.72)}
.myrow b{font-size:16px;font-weight:600}
.myrow .when{grid-column:1;font-size:13px;color:var(--sub)}
.myrow .kp{grid-column:2;grid-row:1/3;background:var(--brand);color:var(--on-brand);font-weight:600}
@media (min-width:700px){.myrow{grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto}.myrow .when{grid-column:2;grid-row:1}.myrow .kp{grid-column:3;grid-row:1}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .myrow,:root:not([data-theme=light]) .mybar h3 .kp{background:rgba(0,0,0,.22)}}
:root[data-theme=dark] .myrow,:root[data-theme=dark] .mybar h3 .kp{background:rgba(0,0,0,.22)}
.kinds{display:grid;gap:12px}
@media (min-width:700px){.kinds{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1050px){.kinds{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kind{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kind .row b{font-size:17px;font-weight:600}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip span{min-width:34px;height:30px;padding:0 6px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;background:var(--ok-soft);color:var(--ink)}
.strip span.use{background:var(--busy);color:var(--busy-ink)}.strip span.mine{background:var(--mine);color:var(--mine-ink);font-weight:600}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub)}
.keys span{display:inline-flex;align-items:center;gap:5px}.keys i{width:10px;height:10px;border-radius:3px;display:block}

/* 본문 서식 */
.md{font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 1.4em}
.md h3{font-size:1.2em;font-weight:700;letter-spacing:-.3px;line-height:1.4;margin:1.8em 0 .6em}
.md h4{font-size:1.05em;font-weight:700;line-height:1.45;margin:1.6em 0 .5em}.md h5{font-size:1em;font-weight:600;margin:1.4em 0 .4em}
.md ul,.md ol{margin:0 0 1.4em;padding-left:1.3em}.md li{margin:.35em 0}
.md blockquote{margin:0 0 1.4em;padding:12px 16px;border-left:3px solid var(--ok);background:var(--fill);border-radius:0 12px 12px 0}.md blockquote p:last-child{margin:0}
.md code{font:.88em ui-monospace,Menlo,monospace;background:var(--fill);padding:1px 4px;border-radius:5px}
.md pre{margin:0 0 1.4em;padding:12px 16px;background:var(--fill);border-radius:14px;overflow-x:auto}.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md a{text-decoration:underline;text-underline-offset:3px}.md a.chip{text-decoration:none}
.md img{display:block;max-width:100%;height:auto;border-radius:12px;margin:0 auto 1.4em}
</style>
</head>
<body>
<header><div class="bar"><a class="mark" href="#/">SWITCH</a><nav id="nav" aria-label="메뉴"></nav><div class="who" id="who"></div></div></header>
<main id="app"></main>
<script src="common.js"></script>
<script>
let me = null;
const isAdmin = () => me && (me.role === 'admin' || me.role === 'super');
// 테두리만 있는 단색 아이콘 — stroke 가 글자색을 따른다
const ICON = {
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  back: '<path d="M9 6.5 4.5 11 9 15.5"/><path d="M5 11h9.5a5 5 0 0 1 0 10H12"/>',
  stop: '<circle cx="12" cy="12" r="7.5"/><path d="m6.8 17.2 10.4-10.4"/>',
  alert: '<path d="M12 6.5v7M12 17v.5"/>',
};
const icon = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const chev = '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>';
const arrowL = '<svg viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></svg>', arrowR = '<svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>';

// 로그인 뒤 돌아갈 곳: 관리 사이트(admin…)에서 왔으면 그쪽으로
const goNext = next => /^admin(#|$)/.test(next) ? location.href = next : location.hash = next;
function goLogin() { location.hash = '#/login?next=' + encodeURIComponent(location.hash || '#/'); }
api.onAuth = () => { me = null; goLogin(); };

const BARE = /^\/(login|signup|forgot|reset)/;     // 로그인·가입·찾기 화면은 머리줄·메뉴 없이
function renderChrome(route) {
  document.body.classList.toggle('bare', BARE.test(route));
  $('#who').innerHTML = me
    ? `${isAdmin() ? '<a class="adm" href="admin">관리 사이트</a>' : ''}<span>${esc(me.name)}</span><a href="#/logout">로그아웃</a>${themeBtn()}`
    : `<a href="#/login">로그인</a>${themeBtn()}`;
  const tabs = [['#/', '로비'], ['#/notices', '공지', '/notice'], ['#/items', '대여'], ['#/reserve', '예약'], ['#/events', '행사', '/event']];
  $('#nav').innerHTML = tabs.map(([h, t, pre]) => {
    const on = route === h.slice(1) || (h !== '#/' && route.startsWith(pre || h.slice(1)));
    return `<a href="${h}" class="${on ? 'on' : ''}"${on ? ' aria-current="page"' : ''}>${t}</a>`;
  }).join('');
}

// ── 라우터 ────────────────────────────────────────────────────────────
const routes = [];
const on = (re, fn, needLogin) => routes.push({re, fn, needLogin});
// 화면 그리기는 한 번에 하나씩 순서대로 — 앞 화면의 응답이 늦게 와서 새 화면을 덮어쓰는 일이 없다.
let routeSeq = 0, routeChain = Promise.resolve();
function route() {
  const my = ++routeSeq;
  routeChain = routeChain.then(() => my === routeSeq ? drawRoute() : null).catch(() => {});
  return routeChain;
}
async function drawRoute() {
  const hash = location.hash.slice(1) || '/';
  const [path, qs] = hash.split('?');
  const q = new URLSearchParams(qs || '');
  if (/^\/admin/.test(path)) { location.href = 'admin'; return; }   // 옛 관리 탭 주소 → 관리 사이트
  renderChrome(path);
  for (const r of routes) {
    const m = path.match(r.re);
    if (!m) continue;
    if (r.needLogin && !me) return goLogin();
    window.scrollTo(0, 0);
    try { await r.fn(m, q); } catch (e) { console.error(e); }
    return;
  }
  location.hash = '#/';
}
addEventListener('hashchange', route);

// ── 로그인 / 가입 ─────────────────────────────────────────────────────
const brand = `<div class="brand"><a class="mark" href="#/">SWITCH</a><span class="muted">반도체융합공학과 학생회</span></div>`;
const homeLink = '<p style="text-align:center;margin:8px 0 0"><a class="home" href="#/">로비로 돌아가기</a></p>';
on(/^\/login$/, (m, q) => {
  const next = q.get('next') || '#/';
  $('#app').innerHTML = `<div class="authbox">${brand}<div class="card">
    <h2>로그인</h2>
    <form id="f"><label class="f">아이디<input name="username" autocomplete="username" autocapitalize="off" required></label>
    <label class="f">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn wide">로그인</button></form>
    <p class="muted" style="text-align:center">처음 이용하십니까? <a href="#/signup?next=${encodeURIComponent(next)}">회원가입</a>&nbsp;&nbsp;&nbsp;<a href="#/forgot">계정 찾기</a></p></div>${homeLink}</div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('login', Object.fromEntries(new FormData(e.target)));
    me = d.user; goNext(next);
  };
});
on(/^\/signup$/, (m, q) => {
  const next = q.get('next') || '#/';
  $('#app').innerHTML = `<div class="authbox">${brand}<div class="card"><h2>회원가입</h2><form id="f">
    <label class="f">아이디 (영문·숫자)<input name="username" autocomplete="username" autocapitalize="off" required minlength="3"></label>
    <label class="f">이름<input name="name" autocomplete="name" required></label>
    <label class="f">학번<input name="student_id" inputmode="numeric" autocomplete="off" required></label>
    <label class="f">이메일<input name="email" type="email" autocomplete="email" required></label>
    <!-- 비밀번호는 맨 끝 — 중간에 두면 iOS 자동완성이 다음 칸(이름)에도 비밀번호를 채운다 -->
    <label class="f">비밀번호 (6자 이상)<input name="password" type="password" autocomplete="new-password" required minlength="6"></label>
    <button class="btn wide">가입하기</button></form>
    <p class="muted" style="text-align:center"><a href="#/login?next=${encodeURIComponent(next)}">이미 계정이 있습니다</a></p></div>${homeLink}</div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('signup', Object.fromEntries(new FormData(e.target)));
    me = d.user; goNext(next);
  };
});
on(/^\/forgot$/, () => {
  $('#app').innerHTML = `<div class="authbox">${brand}<div class="card"><h2>아이디·비밀번호 찾기</h2>
    <p class="muted">가입할 때 쓴 이메일로 아이디와 비밀번호를 바꿀 수 있는 링크를 보내 드립니다.</p>
    <form id="f"><label class="f">이메일<input name="email" type="email" autocomplete="email" required></label>
    <button class="btn wide">메일 보내기</button></form>
    <p class="muted" style="text-align:center"><a href="#/login">로그인으로</a></p></div>${homeLink}</div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    await api('forgot', Object.fromEntries(new FormData(e.target)));
    $('#app').innerHTML = `<div class="authbox">${brand}<div class="card result"><div class="big">${icon('check')}</div>
      <h2>메일을 보냈습니다</h2><p class="muted">가입한 이메일이면 곧 도착합니다. 안 보이면 스팸함도 확인해 주십시오.</p>
      <a class="btn line" href="#/login">로그인으로</a></div></div>`;
  };
});
on(/^\/reset\/([\w-]+)$/, m => {
  history.replaceState(null, '', '#/reset');   // 링크 토큰을 주소창·방문기록에 남기지 않는다
  $('#app').innerHTML = `<div class="authbox">${brand}<div class="card"><h2>새 비밀번호</h2><form id="f">
    <label class="f">새 비밀번호 (6자 이상)<input name="password" type="password" autocomplete="new-password" required minlength="6"></label>
    <button class="btn wide">비밀번호 바꾸기</button></form></div>${homeLink}</div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = await api('reset', {token: m[1], ...Object.fromEntries(new FormData(e.target))});
    me = d.user; toast('비밀번호를 바꿨습니다'); location.hash = '#/';
  };
});
on(/^\/reset$/, () => { location.hash = '#/forgot'; });
on(/^\/logout$/, async () => { await api('logout', {}); me = null; location.hash = '#/'; });

// ── QR 스캔 결과 ──────────────────────────────────────────────────────
on(/^\/q\/([a-z0-9]+)$/, async m => {
  $('#app').innerHTML = `<div class="result"><p class="muted">잠시만 기다려 주십시오…</p></div>`;
  let d;
  // 새로고침·탭 복원으로 같은 주소가 다시 열리면 반납돼 버린다 — 주소에서 QR 코드를 지운다
  history.replaceState(null, '', '#/');
  try { d = await api('scan', {code: m[1]}); }
  catch (e) { $('#app').innerHTML = `<div class="result"><div class="big mute">${icon('alert')}</div><h2 style="font-size:24px">${esc(e.message)}</h2><a class="btn" href="#/">로비로</a></div>`; return; }
  const v = {borrowed: ['check', '대여했습니다', '다 쓰고 같은 QR을 한 번 더 찍으면 반납됩니다.', ''],
             returned: ['back', '반납이 완료됐습니다', '이용해 주셔서 감사합니다.', ''],
             in_use:   ['stop', '다른 사람이 쓰고 있습니다', '반납된 뒤에 다시 찍어 주십시오.', 'mute']}[d.result];
  $('#app').innerHTML = `<div class="result"><div class="big ${v[3]}">${icon(v[0])}</div>
    <h2>${v[1]}</h2><p class="nm">${esc(d.item)}</p><p class="muted">${v[2]}</p>
    <a class="btn" href="#/items">대여 화면으로</a></div>`;
}, true);

// ── 로비 ──────────────────────────────────────────────────────────────
// 작은 글씨 줄의 여러 정보는 · 로 잇지 않고 띄어서 늘어놓는다
// 글자 또는 [글자, 색 이름]
const kp = (...xs) => xs.filter(Boolean).map(x => Array.isArray(x) ? `<span class="kp ${x[1]}">${x[0]}</span>` : `<span class="kp">${x}</span>`).join('');
const stTone = st => st === '모집 중' ? 'ok' : st === '신청함' ? 'mine' : 'dim';
const ddayTag = (s, closed) => { const t = closed ? '' : dday(s); return t ? `<b class="dday ${t === 'D-DAY' ? 'today' : ''}">${t}</b>` : ''; };
function gaugeRow(g) {
  if (!g || g.n == null) return '';
  if (g.capacity == null) return `<div class="g"><div class="t"><span><b>${g.n}명</b> 신청</span><span>인원 제한 없음</span></div>
    <div class="gauge open" role="img" aria-label="${g.n}명 신청, 인원 제한 없음"></div></div>`;
  return `<div class="g"><div class="t"><span><b>${g.n}명</b> 신청</span><span>정원 ${g.capacity}명</span></div>
    <div class="gauge" role="progressbar" aria-label="신청 인원" aria-valuemin="0" aria-valuemax="${g.capacity}" aria-valuenow="${g.n}"><i style="width:${Math.min(100, g.n / g.capacity * 100)}%"></i></div></div>`;
}
function eventsList(list) {
  const open = list.filter(e => !e.closed), done = list.filter(e => e.closed);
  if (!list.length) return '<div class="card muted">아직 열린 행사가 없습니다.</div>';
  return `<div class="evlist">${open.map(e => {
    const g = e.gauge, st = e.applied ? '신청함' : g.full ? '정원 마감' : '모집 중';
    return `<article class="ev"><span class="kicker chipline">${ddayTag(e.deadline, e.closed)}${kp([st, stTone(st)], `${koDate(e.deadline)} 마감`, e.dues_only && '납부자만')}</span><h3>${esc(e.title)}</h3>
      ${e.starts_at ? `<span class="when">${koWhen(e.starts_at)}</span>` : ''}${gaugeRow(g)}
      <div class="acts">${e.applied ? `<a class="pb soft" href="#/event/${e.id}?apply=1">수정</a>` : g.full ? ''
        : e.dues_only && me && !me.dues ? '<span class="muted" style="font-size:13px">학생회비 납부자만 신청할 수 있습니다</span>' : `<a class="pb" href="#/event/${e.id}?apply=1">신청</a>`}
      <a class="lk" href="#/event/${e.id}">자세히</a></div></article>`;
  }).join('')}${done.map(e => `<a class="evdone" href="#/event/${e.id}"><span class="grow">${esc(e.title)}</span><span style="font-size:13px">마감</span>${chev}</a>`).join('')}</div>`;
}

const LEGEND = `<span><i style="background:var(--ok-soft)"></i>비어 있음</span><span><i style="background:var(--busy)"></i>예약됨</span><span><i style="background:var(--mine)"></i>내 예약</span>`;
const whoMsg = (d, h, who) => `${koDate(d)} ${koTime(h)}는 ${who === '내 예약' ? '내가 예약한 시간입니다' : `${who} 님이 예약했습니다`}`;
const days7 = start => [...Array(7)].map((_, i) => addDays(start, i));
const dayHead = (days, today) => `<div class="wk" style="padding-bottom:8px"><span></span>${days.map(d =>
  `<div class="dh ${d === today ? 'today' : ''} ${toDate(d).getDay() === 0 ? 'sun' : ''}">${wd(d)}<b>${+d.slice(8)}</b></div>`).join('')}</div>`;
const rangeLabel = days => `${koDate(days[0]).replace(/ \(.\)$/, '')} – ${days[0].slice(5, 7) === days[6].slice(5, 7) ? `${+days[6].slice(8)}일` : koDate(days[6]).replace(/ \(.\)$/, '')}`;
const HOURS = [...Array(24)].map((_, i) => i);          // 0시~23시 칸 (끝은 24시)

let lobbyRoom = null, lobbyStart = null, bnSlide = 0;
// 배너 그림: 글 번호로 정해지는 난수로 도형 배치를 고른다 — 같은 글은 늘 같은 그림, 글마다 다른 그림
function seeded(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
function bannerArt(b) {
  const r = seeded(b.type + b.id), P = ['var(--ok)', 'var(--mine)', 'var(--sand)', 'var(--art-ink)'];
  const pick = () => P[Math.floor(r() * 3)], k = Math.floor(r() * 3), ev = b.type === 'event';
  let g = '';
  if (ev) {             // 날짜가 가운데 오므로 도형은 모서리로
    const a = Math.floor(r() * 3);
    g = `<circle cx="${290 + r() * 20}" cy="${10 + r() * 20}" r="${70 + r() * 20}" style="fill:${P[a]}"/>
      <circle cx="${10 + r() * 30}" cy="${210 - r() * 20}" r="${50 + r() * 20}" style="fill:${P[(a + 1) % 3]}"/>`;
  } else if (k === 0) { // 큰 원 둘 + 점 격자
    g = `<circle cx="${200 + r() * 40}" cy="${70 + r() * 30}" r="${80 + r() * 20}" style="fill:${P[0]}"/>
      <circle cx="${80 + r() * 30}" cy="${170 + r() * 20}" r="${55 + r() * 15}" style="fill:${P[1]}"/>
      ${[0, 1, 2].map(i => [0, 1, 2].map(j => `<circle cx="${40 + i * 18}" cy="${36 + j * 18}" r="3.5" style="fill:var(--art-ink)"/>`).join('')).join('')}`;
  } else if (k === 1) { // 반원 줄 + 기울어진 네모
    const c1 = pick(), c2 = P[(P.indexOf(c1) + 1) % 3];
    g = `${[0, 1, 2, 3].map(i => `<path d="M${-10 + i * 90} 220 a45 45 0 0 1 90 0z" style="fill:${i % 2 ? c1 : c2}"/>`).join('')}
      <rect x="${170 + r() * 40}" y="${30 + r() * 20}" width="88" height="88" rx="18" transform="rotate(${-12 + r() * 24} 230 80)" style="fill:${pick()}"/>
      <circle cx="${70 + r() * 30}" cy="${70 + r() * 20}" r="26" style="fill:none;stroke:var(--art-ink);stroke-width:6"/>`;
  } else {              // 고리 + 겹친 원 + 작은 네모
    g = `<circle cx="${110 + r() * 40}" cy="${110}" r="${78}" style="fill:${P[1]}"/>
      <circle cx="${200 + r() * 30}" cy="${110}" r="${78}" style="fill:${P[0]};mix-blend-mode:multiply"/>
      <circle cx="${260}" cy="${40 + r() * 20}" r="22" style="fill:none;stroke:var(--art-ink);stroke-width:6"/>
      <rect x="${36 + r() * 20}" y="132" width="30" height="30" rx="8" style="fill:var(--art-ink)"/>`;
  }
  let date = '';
  if (ev) {             // 행사 날(없으면 마감일)을 크게
    const s = b.starts_at || b.event.deadline, d = toDate(s), dd = dday(b.event.deadline);
    date = `<div class="date"><small>${d.getMonth() + 1}월 ${WD[d.getDay()]}요일${b.starts_at ? '' : ' 마감'}</small><b>${d.getDate()}</b>${dd && !b.event.closed ? `<em>마감 ${dd}</em>` : ''}</div>`;
  }
  return `<div class="art" aria-hidden="true"><svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice">${g}</svg>${date}</div>`;
}
function bannerHtml(b) {
  const g = b.event, ev = b.type === 'event';
  const label = ev ? `행사 ${g.closed ? '마감' : g.full ? '정원 마감' : '모집 중'}` : (b.kind === 'dept' ? '학과 공지' : '행사 공지');
  const sub = ev ? [b.starts_at && `${koWhen(b.starts_at)} 시작`, `${koDate(g.deadline)} 마감`].filter(Boolean).join(', ') : b.summary;
  const chip = (b.chips || [])[0];
  const more = ev ? `#/event/${b.id}` : `#/notice/${b.id}`;
  const pb = chip ? (chip.type === 'url' ? `<a class="pb" href="${esc(chip.target)}" target="_blank" rel="noopener noreferrer">${esc(chip.label)}</a>` : `<a class="pb" href="${esc(chipHref(chip))}">${esc(chip.label)}</a>`) : '';
  return `<article><span class="kicker">${label}</span><h2>${esc(b.title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}
    <div class="go">${pb}<a href="${more}">자세히${chev}</a></div></article>${bannerArt(b)}`;
}
on(/^\/$/, async () => {
  const [{banners: bn}, w, ev] = await Promise.all([api('banners'), api('week' + (lobbyStart ? '?start=' + lobbyStart : '')), api('events')]);
  bnSlide = Math.min(bnSlide, Math.max(0, bn.length - 1));
  lobbyStart = w.start; lobbyRoom = lobbyRoom || w.rooms[0].id;
  const carousel = bn.length ? `<section class="bn" aria-label="공지·행사 배너" aria-roledescription="carousel"><div class="banner" id="bn">${bannerHtml(bn[bnSlide])}
    ${bn.length > 1 ? `<div class="dots">${bn.map((_, i) => `<button aria-label="${i + 1}번째 배너" data-s="${i}" class="${i === bnSlide ? 'on' : ''}"><i></i></button>`).join('')}</div>` : ''}</div></section>` : '';
  const days = days7(w.start);
  $('#app').innerHTML = `<div class="lobby">${carousel}
    <section class="ev-sec"><div class="sec-head"><h2>행사</h2><a class="lk" href="#/events">전체 보기${chev}</a></div>${eventsList(ev.events.slice(0, 6))}</section>
    <section class="room"><div class="sec-head"><h2>세미나실</h2><span class="kicker">${rangeLabel(days)}</span></div>
      <div class="row" style="margin-bottom:8px"><div class="seg" style="flex:1;margin:0">${w.rooms.map(r => `<button data-room="${r.id}" class="${r.id === lobbyRoom ? 'on' : ''}">${esc(r.name)}</button>`).join('')}</div>
        <div class="row" style="gap:4px"><button class="rb" id="prev" aria-label="이전 7일">${arrowL}</button>
        <button class="rb txt" id="today">오늘</button>
        <button class="rb" id="next" aria-label="다음 7일">${arrowR}</button></div></div>
      <div class="card" id="tt" style="padding:16px 12px;margin:0" aria-label="세미나실 예약 현황">${weekGrid(w, days)}
        <div class="legend">${LEGEND}</div></div>
      ${me ? '' : `<p class="muted" style="text-align:center">예약·대여·행사 신청은 <a href="#/login">로그인</a> 후 이용할 수 있습니다</p>`}</section></div>`;
  $$('[data-s]').forEach(b => b.onclick = () => { bnSlide = +b.dataset.s; route(); });
  const bnEl = $('#bn');
  if (bnEl && bn.length > 1) {                       // 옆으로 밀어서 넘기기
    let x0 = null;
    bnEl.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive: true});
    bnEl.addEventListener('touchend', e => {
      if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) { bnSlide = (bnSlide + (dx < 0 ? 1 : -1) + bn.length) % bn.length; route(); }
    });
  }
  $$('[data-room]').forEach(b => b.onclick = () => { lobbyRoom = +b.dataset.room; route(); });
  $('#prev').onclick = () => { lobbyStart = addDays(lobbyStart, -7); route(); };
  $('#next').onclick = () => { lobbyStart = addDays(lobbyStart, 7); route(); };
  $('#today').onclick = () => { lobbyStart = null; route(); };
  $('#tt').onclick = e => {
    const td = e.target.closest('[data-date]'); if (!td) return;
    if (td.dataset.who) return toast(whoMsg(td.dataset.date, +td.dataset.hour, td.dataset.who));
    if (!me) return goLogin();
    location.hash = `#/reserve?room=${lobbyRoom}&date=${td.dataset.date}&hour=${td.dataset.hour}`;
  };
});

function weekGrid(w, days) {
  const today = w.now.slice(0, 10), nowH = +w.now.slice(11, 13), map = {};
  w.reservations.filter(r => r.room_id === lobbyRoom).forEach(r => { map[r.date + '|' + r.hour] = r; });
  let h = dayHead(days, today) + '<div class="grid-rows">';
  for (const hr of HOURS) {
    h += `<div class="wk"><span class="hh">${hr}시</span>`;
    for (const d of days) {
      const r = map[d + '|' + hr], past = d < today || (d === today && hr < nowH), at = `data-date="${d}" data-hour="${hr}"`;
      h += r ? `<span class="c ${r.mine ? 'mine' : 'busy'}" ${at} data-who="${esc(r.mine ? '내 예약' : r.who)}" role="img" aria-label="${koDate(d)} ${koTime(hr)} ${r.mine ? '내 예약' : '예약됨'}"></span>`
        : past ? '<span class="p"></span>' : `<button ${at} aria-label="${koDate(d)} ${koTime(hr)} 예약하기"></button>`;
    }
    h += '</div>';
  }
  return h + '</div>';
}

const byKind = items => { const m = new Map(); items.forEach(i => { const k = i.kind || i.name; (m.get(k) || m.set(k, []).get(k)).push(i); }); return [...m]; };

  const d = await api('items');
  const mine = d.items.filter(i => i.mine);
  $('#app').innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="sec-head" style="margin-bottom:0"><h2>물품 대여</h2>
      <span class="keys"><span><i style="background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--line)"></i>대여 가능</span><span><i style="background:var(--busy)"></i>대여 중</span><span><i style="background:var(--mine)"></i>내가 대여 중</span></span></div>
    <p class="muted" style="margin:-4px 4px 0">물품에 붙은 QR을 휴대폰 기본 카메라로 찍으면 대여하고, 한 번 더 찍으면 반납됩니다.</p>
    ${mine.length ? `<section class="mybar" aria-label="내가 대여한 물품"><h3>내가 대여한 물품 <span class="kp">${mine.length}개</span></h3><div class="myrows">${mine.map(i =>
      `<div class="myrow"><b>${esc(i.name)}</b><span class="when">${koStamp(i.borrowed_at)}에 대여</span><span class="kp">${koSpan(i.borrowed_at)}째</span>${i.due ? `<span class="when"><b>${koStamp(i.due)}까지</b> 반납해 주십시오${toDate(i.due) < new Date() ? ' (기한이 지났습니다)' : ''}</span>` : ''}</div>`).join('')}</div></section>` : ''}
    <div class="kinds">${byKind(d.items).map(([k, its]) => {
      const left = its.filter(i => i.available).length;
      return `<section class="kind" aria-label="${esc(k)}"><div class="row"><b class="grow">${esc(k)}</b>
        ${kp(left ? [`${left}개 남음`, 'ok'] : ['모두 사용 중', 'dim'], [`전체 ${its.length}개`, 'dim'])}</div>
        <div class="strip">${its.map(i => {
          const st = i.mine ? '내가 대여 중' : i.available ? '대여 가능' : '대여 중';
          return `<span class="${i.mine ? 'mine' : i.available ? '' : 'use'}" title="${esc(i.name)} ${st}" aria-label="${esc(i.name)} ${st}">${i.num ?? '1개'}</span>`;
        }).join('')}</div></section>`;
    }).join('') || '<div class="card muted">아직 대여할 수 있는 물품이 없습니다.</div>'}</div></div>`;

// ── 세미나실 예약 ─────────────────────────────────────────────────────
on(/^\/reserve$/, async (m, q) => {
  const today = iso(new Date());
  let room = +q.get('room') || null, day = q.get('date') || today, wstart = null;
  // 넘겨받은 날이 오늘부터 7일 안이면 오늘부터, 밖이면 그날부터 보인다
  if (day < today || day > addDays(today, 6)) wstart = day < today ? today : day;
  const sel = new Set(q.get('hour') ? [+q.get('hour')] : []);
  async function draw() {
    const [w, my] = await Promise.all([api('week?start=' + (wstart || today)), api('my_reservations')]);
    room = room || w.rooms[0].id; wstart = w.start;
    const days = days7(w.start);
    if (!days.includes(day)) day = days[0];
    const taken = {};
    w.reservations.filter(r => r.room_id === room).forEach(r => taken[r.date + '|' + r.hour] = r);
    const nowD = w.now.slice(0, 10), nowH = +w.now.slice(11, 13);
    // 내 예약: 같은 방·날의 이어진 시간은 한 줄로
    const mine = [];
    [...my.reservations].sort((a, b) => a.date.localeCompare(b.date) || a.room.localeCompare(b.room) || a.hour - b.hour).forEach(r => {
      const g = mine[mine.length - 1];
      if (g && g.room === r.room && g.date === r.date && g.end === r.hour) { g.end++; g.ids.push(r.id); }
      else mine.push({room: r.room, date: r.date, start: r.hour, end: r.hour + 1, ids: [r.id]});
    });
    $('#app').innerHTML = `<div class="cols"><section class="card tight"><div class="head" style="padding:0 8px;margin:0 0 8px"><h1 class="big-title">세미나실 예약</h1></div>
      <div class="seg" style="margin:0 4px">${w.rooms.map(r => `<button data-room="${r.id}" class="${r.id === room ? 'on' : ''}">${esc(r.name)}</button>`).join('')}</div>
      <div class="wkbar"><b>${rangeLabel(days)}</b><button class="rb" id="prev" aria-label="이전 7일">${arrowL}</button>
        <button class="rb txt" id="today">오늘</button>
        <button class="rb" id="next" aria-label="다음 7일">${arrowR}</button></div>
      <div>${dayHead(days, nowD)}
      <div class="tt" id="tt2">${HOURS.map(hr => `<div class="wk"><span class="hh">${hr}시</span>${days.map(d => {
        const r = taken[d + '|' + hr], past = d < nowD || (d === nowD && hr < nowH);
        const cls = r ? (r.mine ? 'mine' : 'busy') : past ? 'past' : '';
        return `<div class="tc ${cls}" data-d="${d}" data-h="${hr}" ${r ? `data-who="${esc(r.mine ? '내 예약' : r.who)}"` : past ? '' : 'data-free="1"'}></div>`;
      }).join('')}</div>`).join('')}</div></div>
      <div class="legend">${LEGEND}<span>누른 채로 끌면 여러 시간을 한 번에 고릅니다</span></div>
      <div class="act" hidden><span id="sum"></span><button class="btn" id="go" disabled>예약</button></div></section>
      <section class="card"><h3>내 예약</h3>${mine.length ? `<div class="list">${mine.map(g =>
        `<div><span class="grow">${esc(g.room)}<br><span class="muted">${koDay(g.date)}${koDay(g.date) === koDate(g.date) ? '' : ` ${koDate(g.date)}`} ${koRange(g.start, g.end)}</span></span>
        <button class="btn red sm" data-cancel="${g.ids.join(',')}">취소</button></div>`).join('')}</div>` : '<p class="muted" style="margin:0">예약한 시간이 없습니다.</p>'}</section></div>`;
    $$('[data-room]').forEach(b => b.onclick = () => { room = +b.dataset.room; sel.clear(); draw(); });
    $('#prev').onclick = () => { wstart = addDays(wstart, -7); sel.clear(); draw(); };
    $('#next').onclick = () => { wstart = addDays(wstart, 7); sel.clear(); draw(); };
    $('#today').onclick = () => { wstart = today; day = today; sel.clear(); draw(); };
    const cells = $$('#tt2 .tc'), go = $('#go');
    const cell = (d, h) => cells[days.indexOf(d) + h * 7];
    const free = (d, h) => { const c = cell(d, h); return c && c.dataset.free; };
    const paint = () => {
      cells.forEach(c => c.classList.toggle('sel', c.dataset.d === day && sel.has(+c.dataset.h)));
      const hs = [...sel].sort((x, y) => x - y);
      go.disabled = !hs.length; $('.act').hidden = !hs.length;     // 고른 시간이 있을 때만 아래에 띄운다
      $('#sum').textContent = hs.length ? `${koDate(day)} ${koRange(hs[0], hs[hs.length - 1] + 1)} (${hs.length}시간)` : '';
    };
    let anchor = null;
    const extend = h => {                               // 시작 칸부터 h 까지(같은 날), 막힌 칸을 만나면 거기서 멈춘다
      const step = h >= anchor ? 1 : -1; sel.clear();
      for (let i = anchor; i !== h + step && free(day, i); i += step) sel.add(i);
      paint();
    };
    const at = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const c = el && el.closest('#tt2 .tc'); return c ? {d: c.dataset.d, h: +c.dataset.h} : null; };
    const tt2 = $('#tt2');
    tt2.onpointerdown = e => {
      const p = at(e); if (!p) return;
      const c0 = cell(p.d, p.h); if (c0.dataset.who) return toast(whoMsg(p.d, p.h, c0.dataset.who));
      if (!free(p.d, p.h)) return;
      const only = day === p.d && sel.size === 1 && sel.has(p.h);
      day = p.d; anchor = p.h; sel.clear(); if (!only) sel.add(p.h); paint();
      tt2.setPointerCapture(e.pointerId); e.preventDefault();
    };
    tt2.onpointermove = e => { if (anchor == null) return; const p = at(e); if (p && p.d === day) extend(p.h); };
    tt2.onpointerup = tt2.onpointercancel = () => { anchor = null; };
    paint();
    $$('[data-cancel]').forEach(b => b.onclick = async () => {
      if (!confirm('예약을 취소하시겠습니까?')) return;
      await api('unreserve', {ids: b.dataset.cancel.split(',').map(Number)}); toast('취소했습니다'); draw();
    });
    go.onclick = async () => {
      await api('reserve', {room_id: room, date: day, hours: [...sel]});
      sel.clear(); toast('예약했습니다'); draw();
    };
    if (q.get('hour') && sel.size) { const c = cell(day, [...sel][0]); c && c.scrollIntoView({block: 'center'}); }
  }
  await draw();
}, true);

on(/^\/event\/(\d+)$/, async (m, q) => {
  const d = await api('event?id=' + m[1]);
  const e = d.event, g = d.gauge, app = d.application, vals = {};
  e.fields.forEach((f, i) => { const v = app?.answers?.[i]; vals[i] = f.type === 'checkbox' ? !!v : f.type === 'multi' ? (Array.isArray(v) ? [...v] : []) : (v ?? ''); });
  const left = `${ddayTag(e.deadline, e.closed)}${koDate(e.deadline)} 마감`;
  const state = e.closed ? '마감' : app ? '신청함' : g.full ? '정원 마감' : '모집 중';
  const cap = g.capacity, n = g.n;
  const gaugeCard = n == null ? `<div class="gbig"><div class="n"><b style="font-size:22px">${g.full ? '정원이 찼습니다' : '신청 받는 중'}</b></div></div>`
    : `<div class="gbig"><div class="n"><b>${n}명</b><span>신청</span>${cap == null ? '<em>인원 제한 없음</em>' : `<em>${cap - n > 0 ? `정원 ${cap}명 중 ${cap - n}자리 남음` : `정원 ${cap}명 마감`}</em>`}</div>
      ${cap == null ? `<div class="gauge open" role="img" aria-label="${n}명 신청, 인원 제한 없음"></div>` : `<div class="gauge" role="progressbar" aria-label="신청 인원" aria-valuemin="0" aria-valuemax="${cap}" aria-valuenow="${n}"><i style="width:${Math.min(100, n / cap * 100)}%"></i></div>`}</div>`;
  const field = (f, i) => {
    const req = f.required ? ' <span class="req">*</span>' : '';
    if (f.type === 'select' || f.type === 'multi') return `<fieldset data-f="${i}" data-multi="${f.type === 'multi'}"><legend>${esc(f.label)}${req}</legend>${f.type === 'multi' ? '<span style="font-size:12px;color:var(--sub)">여러 개 고를 수 있습니다</span>' : ''}<div class="opts">${f.options.map(o =>
      `<button type="button" data-v="${esc(o)}" aria-pressed="${f.type === 'multi' ? vals[i].includes(o) : vals[i] === o}">${esc(o)}</button>`).join('')}</div></fieldset>`;
    if (f.type === 'checkbox') return `<label class="chk"><input type="checkbox" data-f="${i}" ${vals[i] ? 'checked' : ''}><span>${esc(f.label)}${req}</span></label>`;
    if (f.type === 'dropdown') return `<label class="t">${esc(f.label)}${req}<select data-f="${i}"><option value="">선택</option>${f.options.map(o => `<option ${vals[i] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
    if (f.type === 'long') return `<label class="t">${esc(f.label)}${req}<textarea data-f="${i}" rows="4" maxlength="2000">${esc(vals[i])}</textarea></label>`;
    return `<label class="t">${esc(f.label)}${req}<input data-f="${i}" value="${esc(vals[i])}"></label>`;
  };
  const duesLock = e.dues_only && !me.dues && !app;      // 학생회비를 낸 학생만 받는 행사
  const locked = e.closed || (g.full && !app) || duesLock;
  $('#app').innerHTML = `<div class="col">
    <div class="head"><div class="meta"><a class="lk" href="#/events" style="min-height:32px">‹ 행사 목록</a></div>
      <div class="meta"><span class="pill ${app ? 'mine' : ''}">${state}</span><span>${left}</span>${isAdmin() ? `<a class="pb soft" style="margin-left:auto" href="admin#/event/${e.id}">관리 사이트에서 수정</a>` : ''}</div><h1>${esc(e.title)}</h1></div>
    <section class="card" aria-label="신청 현황" style="margin:0">${gaugeCard}</section>
    <section class="rows" aria-label="행사 정보" style="margin:0">${e.starts_at ? `<div><span>일시</span><span>${koWhen(e.starts_at)}</span></div>` : ''}<div><span>신청 마감</span><span>${koWhen(e.deadline)}</span></div>${e.dues_only ? '<div><span>신청 대상</span><span>학생회비 납부자</span></div>' : ''}</section>
    ${e.body.trim() || d.notice_id ? `<article class="card md" style="margin:0">${md(e.body)}${d.notice_id ? `<a href="#/notice/${d.notice_id}" style="display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:none;margin-top:8px">공지 전체 보기${chev}</a>` : ''}</article>` : ''}
    <section class="card apply" id="applybox" aria-label="신청서" style="margin:0"><h2>신청서</h2>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="kicker">신청자</span><div class="who"><b>${esc(me.name)}</b><span>${esc(me.student_id)}</span></div>
        <span style="font-size:12px;color:var(--sub)">이름·학번·이메일은 계정에서 자동으로 들어갑니다.</span></div>
      <form id="f" style="display:contents">${e.fields.map(field).join('')}
        ${app ? '<div class="done">' + icon('check').replace('class="i"', 'class="i" style="width:20px;height:20px;stroke-width:2.4"') + `<span>신청돼 있습니다. 마감 전까지 수정할 수 있습니다.</span></div>` : ''}
        ${locked ? `<p class="muted" style="margin:0">${e.closed ? '신청이 마감됐습니다.' + (app ? ' 신청한 내용은 위와 같습니다.' : '') : duesLock ? '학생회비 납부자만 신청할 수 있습니다. 납부했는데 이 글이 보이면 학생회에 알려 주십시오.' : '정원이 차서 더 이상 신청할 수 없습니다.'}</p>` : '<button class="btn wide" id="sub"></button>'}</form></section></div>`;
  if (q.get('apply')) $('#applybox').scrollIntoView({behavior: 'smooth'});
  const f = $('#f'), sub = $('#sub');
  if (locked) { f.querySelectorAll('input,button,select,textarea').forEach(x => x.disabled = true); return; }
  const ok = () => e.fields.every((fd, i) => !fd.required || (fd.type === 'checkbox' ? vals[i] : fd.type === 'multi' ? vals[i].length : String(vals[i]).trim()));
  const upd = () => { sub.disabled = !ok(); sub.textContent = ok() ? (app ? '신청 내용 수정' : '참여 신청') : '필수 질문에 답해 주십시오'; };
  f.oninput = ev => { const i = ev.target.dataset.f; if (i == null) return; vals[i] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value; upd(); };
  f.onclick = ev => {
    const b = ev.target.closest('.opts button'); if (!b) return;
    const i = b.closest('fieldset').dataset.f;
    const v = b.dataset.v;
    if (b.closest('fieldset').dataset.multi === 'true') vals[i] = vals[i].includes(v) ? vals[i].filter(x => x !== v) : [...vals[i], v];
    else vals[i] = vals[i] === v ? '' : v;                                   // 한 번 더 누르면 선택 해제
    b.closest('.opts').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', Array.isArray(vals[i]) ? vals[i].includes(x.dataset.v) : x.dataset.v === vals[i]));
    upd();
  };
  upd();
  f.onsubmit = async ev => {
    ev.preventDefault(); if (!ok()) return;
    await api('apply', {event_id: e.id, answers: vals});
    toast(app ? '수정했습니다' : '신청했습니다'); route();
  };
});

// ── 공지 ──────────────────────────────────────────────────────────────
const KIND = {dept: '학과 공지', event: '행사 공지'};
const TABLINK = {home: '#/', notices: '#/notices', events: '#/events', reserve: '#/reserve', loans: '#/items'};
const chipHref = c => c.type === 'tab' ? (TABLINK[c.target] || '#/') : c.type === 'event' ? `#/event/${c.target}?apply=1`
  : c.type === 'notice' ? `#/notice/${c.target}` : c.target;
const chipsHtml = chips => chips?.length ? `<div class="chips">${chips.map(c => c.type === 'url'
  ? `<a class="chip" href="${esc(c.target)}" target="_blank" rel="noopener noreferrer">${esc(c.label)} ›</a>`
  : `<a class="chip" href="${esc(chipHref(c))}">${esc(c.label)} ›</a>`).join('')}</div>` : '';

let noticeKind = '';
on(/^\/notices$/, async () => {
  const d = await api('notices' + (noticeKind ? '?kind=' + noticeKind : ''));
  const tabs = [['', '전체'], ['event', '행사 공지']].concat(me ? [['dept', '학과 공지']] : []);
  $('#app').innerHTML = `<div class="col" style="gap:0"><div class="row"><h2 class="grow" style="margin-bottom:16px">공지</h2>${isAdmin() ? '<a class="btn sm" href="admin#/notice/new">글쓰기</a>' : ''}</div>
    <div class="seg">${tabs.map(([k, n]) => `<button data-k="${k}" class="${k === noticeKind ? 'on' : ''}">${n}</button>`).join('')}</div>
    ${d.notices.map(n => `<a class="nrow" href="#/notice/${n.id}"><span class="kicker chipline">${kp([KIND[n.kind], n.kind === 'event' ? 'ok' : 'mine'], koDate(n.created_at))}</span>
      <h3>${esc(n.title)}</h3>${n.summary ? `<p class="muted" style="margin:4px 0 0">${esc(n.summary)}</p>` : ''}</a>`).join('')
      || '<div class="card muted">아직 올라온 공지가 없습니다.</div>'}
    ${me ? '' : '<p class="muted" style="padding:0 4px">학과 공지는 로그인하면 볼 수 있습니다. <a href="#/login?next=%23%2Fnotices">로그인</a></p>'}</div>`;
  $$('[data-k]').forEach(b => b.onclick = () => { noticeKind = b.dataset.k; route(); });
});
function linkedEvent(g) {
  const st = g.closed ? '마감' : g.full ? '정원 마감' : '모집 중';
  return `<section class="card linked" aria-label="연결된 행사" style="margin:0"><span class="kicker chipline">${ddayTag(g.deadline, g.closed)}${kp('연결된 행사', [st, stTone(st)], `${koDate(g.deadline)} 마감`)}</span>
    <span style="font-size:19px;font-weight:600;letter-spacing:-.4px">${esc(g.title)}</span>${gaugeRow(g)}
    <a class="pb" href="#/event/${g.id}${g.closed ? '' : '?apply=1'}">${g.closed ? '행사 보기' : '신청하러 가기'}</a></section>`;
}
on(/^\/notice\/(\d+)$/, async m => {
  const d = await api('notice?id=' + m[1]), n = d.notice;
  $('#app').innerHTML = `<div class="col"><div class="head"><div class="meta"><a class="lk" href="#/notices" style="min-height:32px">‹ 공지 목록</a></div>
      <div class="meta"><span class="pill">${KIND[n.kind]}</span>${kp(koDate(n.created_at), n.author && esc(n.author))}
      ${isAdmin() ? `<a class="pb soft" style="margin-left:auto" href="admin#/notice/${n.id}">수정</a>` : ''}</div><h1>${esc(n.title)}</h1></div>
    <article class="reading"><div class="md">${md(n.body)}</div>${chipsHtml(n.chips)}</article>
    ${n.event ? linkedEvent(n.event) : ''}
    ${d.prev || d.next ? `<nav class="pn" aria-label="다른 공지">
      ${d.prev ? `<a href="#/notice/${d.prev.id}"><small>이전 글</small><b>${esc(d.prev.title)}</b></a>` : ''}${d.next ? `<a href="#/notice/${d.next.id}"><small>다음 글</small><b>${esc(d.next.title)}</b></a>` : ''}</nav>` : ''}</div>`;
});

api('me').then(d => { me = d.user; route(); });
</script>
</body>
</html>
