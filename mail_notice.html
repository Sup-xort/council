<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$title</title>
</head>
<body style="margin:0;padding:0;background:#f3efee;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">$preview</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3efee;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif;color:#2b2222;">
<tr><td style="background:#5b4545;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:700;letter-spacing:0.5px;">SWITCH
<span style="font-size:13px;font-weight:400;opacity:0.8;">&nbsp;반도체융합공학과 학생회</span></td></tr>
<tr><td style="padding:28px 28px 8px 28px;">
<span style="display:inline-block;padding:4px 10px;border-radius:999px;background:#f0e7e5;color:#5b4545;font-size:12px;font-weight:700;">$label</span>
<h1 style="margin:14px 0 0 0;font-size:22px;line-height:1.4;font-weight:700;color:#2b2222;">$title</h1>
<p style="margin:6px 0 0 0;font-size:13px;color:#8a7b79;">$date</p>
</td></tr>
<tr><td style="padding:16px 28px 8px 28px;font-size:15px;line-height:1.75;color:#3d3333;">$summary</td></tr>
<tr><td align="left" style="padding:16px 28px 32px 28px;">
<a href="$link" style="display:inline-block;padding:13px 26px;border-radius:10px;background:#5b4545;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">공지 전문 보기</a>
</td></tr>
<tr><td style="padding:0 28px;"><div style="height:1px;background:#ebe3e1;line-height:1px;font-size:1px;">&nbsp;</div></td></tr>
<tr><td style="padding:22px 28px 28px 28px;background:#faf7f6;font-size:12px;line-height:1.7;color:#8a7b79;">
<p style="margin:0 0 14px 0;">이 메일은 SWITCH 사이트에서 $label 메일 받기를 켠 분께 보냈습니다.</p>
<a href="$unsub" style="display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid #5b4545;color:#5b4545;font-size:13px;font-weight:700;text-decoration:none;background:#ffffff;">$label 알림 차단</a>
<p style="margin:14px 0 0 0;">차단해도 사이트의 공지는 그대로 볼 수 있고, 설정 화면에서 언제든 다시 켤 수 있습니다.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
